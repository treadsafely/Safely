# Step 8 (last) of the e2e chain: sign out of the (only) account, then do a
# first-run import from the welcome screen — the path a user restoring a
# wallet on a new phone takes.
#
# Starts from the state app-lock finished in: lock screen enabled, passcode 5678.
# Signing out of the last account erases all app data and reloads the app;
# if anything survives, the welcome screen crashes ("opened with an existing
# account") and this flow fails. Must stay last.
appId: com.safely.wallet
name: onboarding-import-wallet
tags:
    - smoke
    - onboarding
    - import
---
# Relaunch WITHOUT clearState — signing out is part of the test.
- launchApp

# Home renders under the lock overlay, so wait for it, then unlock if locked.
- extendedWaitUntil:
      visible:
          id: 'home.settingsButton'
      timeout: 60000
- runFlow:
      when:
          visible:
              id: 'lockScreen.screen'
      commands:
          - tapOn:
                text: '5'
                childOf:
                    id: 'lockScreen.screen'
          - tapOn:
                text: '6'
                childOf:
                    id: 'lockScreen.screen'
          - tapOn:
                text: '7'
                childOf:
                    id: 'lockScreen.screen'
          - tapOn:
                text: '8'
                childOf:
                    id: 'lockScreen.screen'
- extendedWaitUntil:
      notVisible:
          id: 'lockScreen.screen'
      timeout: 15000

# Settings -> "Sign out of <account>" -> confirm.
- tapOn:
      id: 'home.settingsButton'
- scrollUntilVisible:
      element:
          id: 'settings.signOutAccount'
      direction: DOWN
      timeout: 15000
- tapOn:
      id: 'settings.signOutAccount'
- extendedWaitUntil:
      visible:
          id: 'signOutAccount.confirmButton'
      timeout: 15000
- waitForAnimationToEnd
# Without linked devices the sheet asks to tick "I understand" first.
- runFlow:
      when:
          visible:
              id: 'signOutAccount.checkbox'
      commands:
          - tapOn:
                id: 'signOutAccount.checkbox'
- tapOn:
      id: 'signOutAccount.confirmButton'

# All data is erased and the app reloads into onboarding.
- extendedWaitUntil:
      visible:
          id: 'welcome.importWallet'
      timeout: 60000
- tapOn:
      id: 'welcome.importWallet'

# The seed input autofocuses ~400ms after the screen gets focus.
- extendedWaitUntil:
      visible:
          id: 'importWallet.continueButton'
      timeout: 15000
- waitForAnimationToEnd
- inputText: ${MAESTRO_SEED_PHRASE}
- tapOn:
      id: 'importWallet.continueButton'

# Passcode setup: enter + re-enter.
- waitForAnimationToEnd
- tapOn: '1'
- tapOn: '2'
- tapOn: '3'
- tapOn: '4'
- waitForAnimationToEnd
- tapOn: '1'
- tapOn: '2'
- tapOn: '3'
- tapOn: '4'

# Account creation runs behind a loader (import derives + syncs, so it can take
# a while), then the optional biometry / notifications prompts. Poll for them
# every ~2s instead of a fixed wait, since either may be skipped by the app.
- repeat:
      times: 30
      while:
          notVisible:
              id: 'home.settingsButton'
      commands:
          - runFlow:
                when:
                    visible:
                        id: 'biometry.skip'
                commands:
                    - tapOn:
                          id: 'biometry.skip'
          - runFlow:
                when:
                    visible:
                        id: 'onboarding.notificationsLater'
                commands:
                    - tapOn:
                          id: 'onboarding.notificationsLater'
          - extendedWaitUntil:
                visible:
                    id: 'home.settingsButton'
                timeout: 2000
                optional: true

- extendedWaitUntil:
      visible:
          id: 'home.settingsButton'
      timeout: 60000

# The imported wallet must be the one derived from MAESTRO_SEED_PHRASE.
- tapOn:
      id: 'home.receiveButton'
- extendedWaitUntil:
      visible:
          id: 'receive.address'
      timeout: 15000
- assertVisible:
      id: 'receive.address'
      text: ${MAESTRO_IMPORTED_WALLET_ADDRESS}
