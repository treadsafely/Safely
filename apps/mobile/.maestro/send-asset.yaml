# Step 6 of the e2e chain: sends ~0.0000101-0.0000199 BTC from the wallet
# imported by import-wallet (it is the active one) to MAESTRO_RECIPIENT_ADDRESS,
# then checks the transaction shows up in the BTC history as pending.
#
# Every run sends from the same MAESTRO_SEED_PHRASE wallet, so a pending tx
# left by an earlier run can still be in the history. The amount is random
# per run and the history check matches it, so only this run's tx passes.
# It has exactly 3 significant digits and no trailing zero: the history row
# rounds a crypto amount below 1 to 3 significant digits, and the amount is
# shown as sent (no fee) unless "show full sent amount" is on, which a fresh
# import leaves off.
appId: com.safely.wallet
name: send-asset
tags:
    - smoke
    - send
---
# Relaunch WITHOUT clearState — we continue on top of the previous flow's state.
- launchApp

- extendedWaitUntil:
      visible:
          id: 'home.sendButton'
      timeout: 60000
- tapOn:
      id: 'home.sendButton'

# Recipient step.
- extendedWaitUntil:
      visible:
          id: 'send.addressInput'
      timeout: 15000
- waitForAnimationToEnd
- tapOn:
      id: 'send.addressInput'
- inputText: ${MAESTRO_RECIPIENT_ADDRESS}
- tapOn:
      id: 'send.nextButton'

# Amount step: the input starts in crypto mode.
# 1, then any digit, then a non-zero one: 3 significant digits, no trailing zero.
- evalScript:
      ${output.sendDigits = '1' + Math.floor(Math.random() * 10) + (1 + Math.floor(Math.random() *
      9))}
- extendedWaitUntil:
      visible:
          id: 'send.amountInput'
      timeout: 15000
- waitForAnimationToEnd
- tapOn:
      id: 'send.amountInput'
- inputText: ${'0.0000' + output.sendDigits}
- tapOn:
      id: 'send.nextButton'

# Confirmation: the slider is disabled until the fee estimate is ready.
- extendedWaitUntil:
      visible:
          id: 'confirmation.fee'
      timeout: 30000
- waitForAnimationToEnd

# Slide to confirm: drag the knob to the right end of the track.
- swipe:
      from:
          id: 'confirmation.sliderKnob'
      direction: RIGHT

# Signing decrypts the secret, which requires passcode verification.
- extendedWaitUntil:
      visible:
          id: 'passcodeVerification.screen'
      timeout: 15000
- runFlow:
      file: subflows/enter-passcode.yaml
      env:
          SCREEN_ID: 'passcodeVerification.screen'

# Wait for broadcast success and return to the wallet.
- extendedWaitUntil:
      visible:
          id: 'confirmation.backToWallet'
      timeout: 60000
- tapOn:
      id: 'confirmation.backToWallet'

- extendedWaitUntil:
      visible:
          id: 'home.settingsButton'
      timeout: 30000

# BTC asset -> history: this run's transaction must appear as pending.
# The decimal separator follows the device locale.
- extendedWaitUntil:
      visible:
          id: 'home.asset.btc'
      timeout: 30000
- tapOn:
      id: 'home.asset.btc'
- extendedWaitUntil:
      visible:
          text: ${'.*0[.,]0000' + output.sendDigits + '(\\D.*)?'}
          childOf:
              id: 'history.pendingItem'
      timeout: 60000
