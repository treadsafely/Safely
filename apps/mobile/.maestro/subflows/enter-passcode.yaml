# Types passcode 1234 on the keypad of the screen with id SCREEN_ID
# (passcodeVerification.screen or onboardingPasscode.screen).
# Every flow in the chain assumes this passcode.
appId: com.safely.wallet
---
- tapOn:
      text: '1'
      childOf:
          id: ${SCREEN_ID}
- tapOn:
      text: '2'
      childOf:
          id: ${SCREEN_ID}
- tapOn:
      text: '3'
      childOf:
          id: ${SCREEN_ID}
- tapOn:
      text: '4'
      childOf:
          id: ${SCREEN_ID}
