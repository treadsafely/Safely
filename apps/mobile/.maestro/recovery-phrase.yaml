# Step 3 of the e2e chain: the recovery phrase shown to the user must restore
# the wallet it belongs to. Starts from the state create-wallet finished in:
# the freshly generated wallet is the active one, passcode 1234.
#
# Remembers the generated wallet's receive address, reveals its phrase,
# imports the phrase as a new wallet and expects the same receive address.
# Then removes that restored wallet again and checks it is gone from the
# wallet list — so the chain does not carry a duplicate wallet further.
# (A generated wallet has a master-key-derived id, so re-importing its phrase
# is not detected as a duplicate — it is added as a separate imported wallet,
# which becomes the active one.)
appId: com.safely.wallet
name: recovery-phrase
tags:
    - smoke
    - recovery
---
# Relaunch WITHOUT clearState — we continue on top of the previous flow's state.
- launchApp

- extendedWaitUntil:
      visible:
          id: 'home.receiveButton'
      timeout: 60000

# Remember the generated wallet's receive address.
- tapOn:
      id: 'home.receiveButton'
- extendedWaitUntil:
      visible:
          id: 'receive.address'
      timeout: 15000
- copyTextFrom:
      id: 'receive.address'
- evalScript: ${output.generatedAddress = maestro.copiedText.trim()}

# Restart to drop the receive modal.
- launchApp
- extendedWaitUntil:
      visible:
          id: 'home.settingsButton'
      timeout: 60000

# Settings -> current wallet -> "Recovery phrase" -> confirm sheet -> reveal.
- tapOn:
      id: 'home.settingsButton'
- extendedWaitUntil:
      visible:
          id: 'settings.currentWallet'
      timeout: 15000
- tapOn:
      id: 'settings.currentWallet'
- extendedWaitUntil:
      visible:
          id: 'walletSettings.recoveryPhrase'
      timeout: 15000
- tapOn:
      id: 'walletSettings.recoveryPhrase'
- extendedWaitUntil:
      visible:
          id: 'recovery.revealButton'
      timeout: 15000
- waitForAnimationToEnd
- tapOn:
      id: 'recovery.revealButton'

# Decrypting the mnemonic requires passcode verification.
- extendedWaitUntil:
      visible:
          id: 'passcodeVerification.screen'
      timeout: 15000
- tapOn:
      text: '1'
      childOf:
          id: 'passcodeVerification.screen'
- tapOn:
      text: '2'
      childOf:
          id: 'passcodeVerification.screen'
- tapOn:
      text: '3'
      childOf:
          id: 'passcodeVerification.screen'
- tapOn:
      text: '4'
      childOf:
          id: 'passcodeVerification.screen'

- extendedWaitUntil:
      visible:
          id: 'recovery.word.12'
      timeout: 15000

# Read the words one by one (recovery.word.1 .. recovery.word.12)
# and join them into output.recoveryPhrase.
- evalScript: ${output.recoveryPhrase = ''; output.wordIndex = 1}
- repeat:
      times: 12
      commands:
          - copyTextFrom:
                id: ${'recovery.word.' + output.wordIndex}
          - evalScript:
                ${output.recoveryPhrase = (output.recoveryPhrase + ' ' +
                maestro.copiedText.trim()).trim(); output.wordIndex = output.wordIndex + 1}
- assertTrue: ${output.recoveryPhrase.split(' ').length === 12}

# Restart to drop the settings modals and get back to home.
- launchApp
- extendedWaitUntil:
      visible:
          id: 'home.walletSelector'
      timeout: 60000

# Wallet selector popup -> "Add wallet" -> "Import existing" with the revealed phrase.
- tapOn:
      id: 'home.walletSelector'
- tapOn:
      id: 'accounts.addWallet'
- tapOn:
      id: 'addWallet.importExisting'
- extendedWaitUntil:
      visible:
          id: 'importWallet.continueButton'
      timeout: 15000
- waitForAnimationToEnd
- inputText: ${output.recoveryPhrase}
- tapOn:
      id: 'importWallet.continueButton'

# Customize step: give the restored wallet a recognizable name,
# used below to check that removing it really removes it.
- extendedWaitUntil:
      visible:
          id: 'customizeWallet.nameInput'
      timeout: 15000
- tapOn:
      id: 'customizeWallet.nameInput'
- eraseText: 50
- inputText: 'E2E Restored'
- tapOn:
      id: 'customizeWallet.saveButton'

# Encrypting the imported secret requires passcode verification.
- extendedWaitUntil:
      visible:
          id: 'passcodeVerification.screen'
      timeout: 15000
- tapOn:
      text: '1'
      childOf:
          id: 'passcodeVerification.screen'
- tapOn:
      text: '2'
      childOf:
          id: 'passcodeVerification.screen'
- tapOn:
      text: '3'
      childOf:
          id: 'passcodeVerification.screen'
- tapOn:
      text: '4'
      childOf:
          id: 'passcodeVerification.screen'

# Import, then navigation resets to home with the imported wallet active.
- extendedWaitUntil:
      notVisible:
          id: 'passcodeVerification.screen'
      timeout: 15000
- extendedWaitUntil:
      visible:
          id: 'home.receiveButton'
      timeout: 60000

# The phrase must derive the very same receive address.
- tapOn:
      id: 'home.receiveButton'
- extendedWaitUntil:
      visible:
          id: 'receive.address'
      timeout: 15000
- assertVisible:
      id: 'receive.address'
      text: ${output.generatedAddress}

# ---- Remove the restored wallet ----
- launchApp
- extendedWaitUntil:
      visible:
          id: 'home.settingsButton'
      timeout: 60000
# It is the active one: its name is in the home header.
- assertVisible: 'E2E Restored'

# Settings -> current wallet -> "Remove wallet" -> confirm sheet.
- tapOn:
      id: 'home.settingsButton'
- extendedWaitUntil:
      visible:
          id: 'settings.currentWallet'
      timeout: 15000
- tapOn:
      id: 'settings.currentWallet'
- scrollUntilVisible:
      element:
          id: 'walletSettings.removeWallet'
      direction: DOWN
      timeout: 15000
- tapOn:
      id: 'walletSettings.removeWallet'
- extendedWaitUntil:
      visible:
          id: 'removeWallet.confirmButton'
      timeout: 15000
- waitForAnimationToEnd
# The "I understand" checkbox is shown only for some wallet states.
- runFlow:
      when:
          visible:
              id: 'removeWallet.checkbox'
      commands:
          - tapOn:
                id: 'removeWallet.checkbox'
- tapOn:
      id: 'removeWallet.confirmButton'

# Removing a wallet requires passcode verification.
- extendedWaitUntil:
      visible:
          id: 'passcodeVerification.screen'
      timeout: 15000
- tapOn:
      text: '1'
      childOf:
          id: 'passcodeVerification.screen'
- tapOn:
      text: '2'
      childOf:
          id: 'passcodeVerification.screen'
- tapOn:
      text: '3'
      childOf:
          id: 'passcodeVerification.screen'
- tapOn:
      text: '4'
      childOf:
          id: 'passcodeVerification.screen'

# Navigation resets to home with another wallet active.
- extendedWaitUntil:
      notVisible:
          id: 'passcodeVerification.screen'
      timeout: 15000
- extendedWaitUntil:
      visible:
          id: 'home.walletSelector'
      timeout: 30000

# The removed wallet must be gone from the wallet list.
- tapOn:
      id: 'home.walletSelector'
- extendedWaitUntil:
      visible:
          id: 'accounts.addWallet'
      timeout: 15000
- assertNotVisible: 'E2E Restored'
