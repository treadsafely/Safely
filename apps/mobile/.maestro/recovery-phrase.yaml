# Step 3 of the e2e chain: the recovery phrase shown to the user must restore
# the wallet it belongs to. Starts from the state create-wallet finished in:
# the freshly generated wallet is the active one, passcode 1234.
#
# Remembers the generated wallet's receive address, reveals its phrase,
# imports the phrase as a new wallet and expects the same receive address.
# (A generated wallet has a master-key-derived id, so re-importing its phrase
# is not detected as a duplicate — it is added as a separate imported wallet,
# "E2E Restored", which becomes the active one.) The restored wallet is left
# in place: later flows add their own wallets, each of which becomes active.
appId: com.safely.wallet
name: recovery-phrase
tags:
    - smoke
    - recovery
---
# Relaunch WITHOUT clearState — we continue on top of the previous flow's state.
- launchApp

- extendedWaitUntil:
      visible:
          id: 'home.receiveButton'
      timeout: 60000

# Remember the generated wallet's receive address.
- tapOn:
      id: 'home.receiveButton'
- extendedWaitUntil:
      visible:
          id: 'receive.address'
      timeout: 15000
- copyTextFrom:
      id: 'receive.address'
- evalScript: ${output.generatedAddress = maestro.copiedText.trim()}

# Close the receive modal (cheaper than a cold restart).
# Home stays in the hierarchy under modals, so wait for the modal to go away
# rather than for home to be "visible".
- tapOn:
      id: 'receive.closeButton'
- extendedWaitUntil:
      notVisible:
          id: 'receive.address'
      timeout: 15000

# Settings -> current wallet -> "Recovery phrase" -> confirm sheet -> reveal.
- tapOn:
      id: 'home.settingsButton'
- extendedWaitUntil:
      visible:
          id: 'settings.currentWallet'
      timeout: 15000
- tapOn:
      id: 'settings.currentWallet'
- extendedWaitUntil:
      visible:
          id: 'walletSettings.recoveryPhrase'
      timeout: 15000
- tapOn:
      id: 'walletSettings.recoveryPhrase'
- extendedWaitUntil:
      visible:
          id: 'recovery.revealButton'
      timeout: 15000
- waitForAnimationToEnd
- tapOn:
      id: 'recovery.revealButton'

# Decrypting the mnemonic requires passcode verification.
- extendedWaitUntil:
      visible:
          id: 'passcodeVerification.screen'
      timeout: 15000
- tapOn:
      text: '1'
      childOf:
          id: 'passcodeVerification.screen'
- tapOn:
      text: '2'
      childOf:
          id: 'passcodeVerification.screen'
- tapOn:
      text: '3'
      childOf:
          id: 'passcodeVerification.screen'
- tapOn:
      text: '4'
      childOf:
          id: 'passcodeVerification.screen'

- extendedWaitUntil:
      visible:
          id: 'recovery.word.12'
      timeout: 15000

# Read the words one by one (recovery.word.1 .. recovery.word.12)
# and join them into output.recoveryPhrase.
- evalScript: ${output.recoveryPhrase = ''; output.wordIndex = 1}
- repeat:
      times: 12
      commands:
          - copyTextFrom:
                id: ${'recovery.word.' + output.wordIndex}
          - evalScript:
                ${output.recoveryPhrase = (output.recoveryPhrase + ' ' +
                maestro.copiedText.trim()).trim(); output.wordIndex = output.wordIndex + 1}
- assertTrue: ${output.recoveryPhrase.split(' ').length === 12}

# Close the phrase sheet -> back from wallet settings -> close settings.
# Screens underneath stay in the hierarchy, so before each tap wait for the
# screen on top to disappear. The reveal confirm sheet closes itself (with an
# animation) once wallet settings regains focus.
- tapOn:
      id: 'recovery.closeButton'
- extendedWaitUntil:
      notVisible:
          id: 'recovery.word.1'
      timeout: 15000
- extendedWaitUntil:
      notVisible:
          id: 'recovery.revealButton'
      timeout: 15000
- waitForAnimationToEnd
- tapOn:
      id: 'walletSettings.backButton'
- extendedWaitUntil:
      notVisible:
          id: 'walletSettings.recoveryPhrase'
      timeout: 15000
- tapOn:
      id: 'settings.closeButton'
- extendedWaitUntil:
      notVisible:
          id: 'settings.currentWallet'
      timeout: 15000

# Wallet selector popup -> "Add wallet" -> "Import existing" with the revealed phrase.
- tapOn:
      id: 'home.walletSelector'
- tapOn:
      id: 'accounts.addWallet'
- tapOn:
      id: 'addWallet.importExisting'
- extendedWaitUntil:
      visible:
          id: 'importWallet.continueButton'
      timeout: 15000
- waitForAnimationToEnd
- inputText: ${output.recoveryPhrase}
- tapOn:
      id: 'importWallet.continueButton'

# Customize step: give the restored wallet a recognizable name,
# used below to make sure the receive check runs against it.
- extendedWaitUntil:
      visible:
          id: 'customizeWallet.nameInput'
      timeout: 15000
- tapOn:
      id: 'customizeWallet.nameInput'
- eraseText: 50
- inputText: 'E2E Restored'
- tapOn:
      id: 'customizeWallet.saveButton'

# Encrypting the imported secret requires passcode verification.
- extendedWaitUntil:
      visible:
          id: 'passcodeVerification.screen'
      timeout: 15000
- tapOn:
      text: '1'
      childOf:
          id: 'passcodeVerification.screen'
- tapOn:
      text: '2'
      childOf:
          id: 'passcodeVerification.screen'
- tapOn:
      text: '3'
      childOf:
          id: 'passcodeVerification.screen'
- tapOn:
      text: '4'
      childOf:
          id: 'passcodeVerification.screen'

# Import, then navigation resets to home with the imported wallet active.
# Home stays in the hierarchy under the modals, so wait for the customize
# screen to go away, then for the restored wallet's name in the home header —
# otherwise the receive check below could run against the generated wallet
# (which has the same address) and pass even if the import failed.
- extendedWaitUntil:
      notVisible:
          id: 'passcodeVerification.screen'
      timeout: 15000
- extendedWaitUntil:
      notVisible:
          id: 'customizeWallet.saveButton'
      timeout: 60000
- extendedWaitUntil:
      visible: 'E2E Restored'
      timeout: 15000

# The phrase must derive the very same receive address.
- tapOn:
      id: 'home.receiveButton'
- extendedWaitUntil:
      visible:
          id: 'receive.address'
      timeout: 15000
- assertVisible:
      id: 'receive.address'
      text: ${output.generatedAddress}
