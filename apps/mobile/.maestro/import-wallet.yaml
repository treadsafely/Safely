# Step 5 of the e2e chain: imports a wallet from MAESTRO_SEED_PHRASE.
# Needs an onboarded state: a wallet on the home screen, passcode 1234,
# biometry skipped. Must run right before send-asset — the imported wallet
# becomes the active one, and send-asset sends from the active wallet.
appId: com.safely.wallet
name: import-wallet
tags:
    - smoke
    - import
---
# Relaunch WITHOUT clearState — we continue on top of the previous flow's state.
- launchApp

- extendedWaitUntil:
      visible:
          id: 'home.walletSelector'
      timeout: 60000

# Wallet selector popup -> "Add wallet" -> "Import existing".
- tapOn:
      id: 'home.walletSelector'
- tapOn:
      id: 'accounts.addWallet'
- tapOn:
      id: 'addWallet.importExisting'

# The seed input autofocuses ~400ms after the screen gets focus —
# wait the transition out, then type into the focused field.
- extendedWaitUntil:
      visible:
          id: 'importWallet.continueButton'
      timeout: 15000
- waitForAnimationToEnd

# Negative check first: 12 valid BIP39 words with a broken checksum
# ("abandon" x12 — the valid phrase ends with "about") must be rejected
# with an error, and the form must stay on screen.
- inputText:
      'abandon abandon abandon abandon abandon abandon abandon abandon abandon abandon abandon
      abandon'
- tapOn:
      id: 'importWallet.continueButton'
- extendedWaitUntil:
      visible:
          id: 'importWallet.error'
      timeout: 10000
- assertNotVisible:
      id: 'customizeWallet.saveButton'

# Go back and reopen the screen to get an empty field — more reliable than
# erasing text in the masked native input.
- tapOn:
      id: 'importWallet.backButton'
- tapOn:
      id: 'addWallet.importExisting'
- extendedWaitUntil:
      visible:
          id: 'importWallet.continueButton'
      timeout: 15000
- waitForAnimationToEnd
- assertNotVisible:
      id: 'importWallet.error'
- inputText: ${MAESTRO_SEED_PHRASE}

- tapOn:
      id: 'importWallet.continueButton'

# Customize step: the name is prefilled, just save.
- extendedWaitUntil:
      visible:
          id: 'customizeWallet.saveButton'
      timeout: 15000
- tapOn:
      id: 'customizeWallet.saveButton'

# Encrypting the imported secret requires passcode verification.
- extendedWaitUntil:
      visible:
          id: 'passcodeVerification.screen'
      timeout: 15000
- tapOn: '1'
- tapOn: '2'
- tapOn: '3'
- tapOn: '4'

# Import + initial sync, then navigation resets to home
# with the imported wallet active.
- extendedWaitUntil:
      visible:
          id: 'home.settingsButton'
      timeout: 60000

# Verify the import actually derived the right wallet: the address on the
# receive screen must match the one expected for MAESTRO_SEED_PHRASE.
- tapOn:
      id: 'home.receiveButton'
- extendedWaitUntil:
      visible:
          id: 'receive.address'
      timeout: 15000
- assertVisible:
      id: 'receive.address'
      text: ${MAESTRO_IMPORTED_WALLET_ADDRESS}
