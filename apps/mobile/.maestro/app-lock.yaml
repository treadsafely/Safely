# Step 7 of the e2e chain: the lock screen survives an app restart.
# Starts from any onboarded state (passcode 1234, biometry skipped).
# Leaves the lock screen ENABLED — the next flow (onboarding-import-wallet)
# wipes the app with clearState, so nothing after it is affected.
appId: com.safely.wallet
name: app-lock
tags:
    - smoke
    - security
---
# Relaunch WITHOUT clearState — we continue on top of the previous flow's state.
- launchApp

- extendedWaitUntil:
      visible:
          id: 'home.settingsButton'
      timeout: 60000

# Settings -> Security -> enable "Lock screen".
- tapOn:
      id: 'home.settingsButton'
- scrollUntilVisible:
      element:
          id: 'settings.security'
      direction: DOWN
      timeout: 15000
- tapOn:
      id: 'settings.security'
- extendedWaitUntil:
      visible:
          id: 'security.lockScreenSwitch'
      timeout: 15000
- tapOn:
      id: 'security.lockScreenSwitch'

# Toggling the setting requires passcode verification.
- extendedWaitUntil:
      visible:
          id: 'passcodeVerification.screen'
      timeout: 15000
- tapOn:
      text: '1'
      childOf:
          id: 'passcodeVerification.screen'
- tapOn:
      text: '2'
      childOf:
          id: 'passcodeVerification.screen'
- tapOn:
      text: '3'
      childOf:
          id: 'passcodeVerification.screen'
- tapOn:
      text: '4'
      childOf:
          id: 'passcodeVerification.screen'

# Let the verification close and the setting get persisted before killing the app.
- extendedWaitUntil:
      notVisible:
          id: 'passcodeVerification.screen'
      timeout: 15000
- waitForAnimationToEnd

# Cold start: the lock screen must be shown before anything else.
# Note: the lock overlay is drawn on top of the navigation tree, so home
# elements underneath stay in the view hierarchy — assert on the lock screen
# itself, not on the absence of home elements.
- launchApp
- extendedWaitUntil:
      visible:
          id: 'lockScreen.screen'
      timeout: 60000

# A wrong passcode keeps the app locked (1 failed attempt — lockout starts after 3).
# Digits are scoped to the lock screen so they never hit text on home underneath.
- tapOn:
      text: '0'
      childOf:
          id: 'lockScreen.screen'
- tapOn:
      text: '0'
      childOf:
          id: 'lockScreen.screen'
- tapOn:
      text: '0'
      childOf:
          id: 'lockScreen.screen'
- tapOn:
      text: '0'
      childOf:
          id: 'lockScreen.screen'
# Error shake + input reset take ~300ms.
- waitForAnimationToEnd
- assertVisible:
      id: 'lockScreen.screen'

# The correct passcode unlocks: the overlay goes away and home is usable.
- tapOn:
      text: '1'
      childOf:
          id: 'lockScreen.screen'
- tapOn:
      text: '2'
      childOf:
          id: 'lockScreen.screen'
- tapOn:
      text: '3'
      childOf:
          id: 'lockScreen.screen'
- tapOn:
      text: '4'
      childOf:
          id: 'lockScreen.screen'

- extendedWaitUntil:
      notVisible:
          id: 'lockScreen.screen'
      timeout: 15000
- assertVisible:
      id: 'home.settingsButton'
