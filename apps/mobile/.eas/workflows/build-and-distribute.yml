name: Build & Distribute to Firebase

on:
  push:
    branches:
      - master
      - release/[0-9]*.[0-9]*.[0-9]*
  workflow_dispatch:
    inputs:
      release_notes:
        description: Release notes / "What to Test" for testers. Overrides the commit message.
        type: string
        required: false
        default: ''

jobs:
  prepare:
    name: Prepare release notes & profile
    # `env` must be job-level (step-level `env:` is unsupported and left as raw
    # literals); passing values as env vars also keeps them shell-injection-safe.
    # `|| ''` guards github.* fields that are empty on workflow_dispatch runs.
    env:
      COMMIT_MESSAGE: ${{ github.commit_message || '' }}
      MANUAL_NOTES: ${{ inputs.release_notes || '' }}
      REF_NAME: ${{ github.ref_name || '' }}
      EVENT_NAME: ${{ github.event_name }}
    outputs:
      notes: ${{ steps.prep.outputs.notes }}
      android_profile: ${{ steps.prep.outputs.android_profile }}
      build_type: ${{ steps.prep.outputs.build_type }}
    steps:
      - name: Compute notes & profile
        id: prep
        run: |
          if [ -n "$MANUAL_NOTES" ]; then
            RAW="$MANUAL_NOTES"
          else
            RAW="${COMMIT_MESSAGE:-Build from $REF_NAME}"
          fi
          # EAS Workflows doesn't quote-safe-interpolate values into its internal
          # bash; unescaped () ` $ " ' \ in the changelog cause exit 141 / SIGPIPE /
          # empty log. Strip them here so the value is safe for set-output AND for
          # every downstream interpolation (build message, TestFlight changelog,
          # Firebase notes, Slack report).
          NOTES=$(printf '%s' "$RAW" \
            | tr -d '\r' \
            | tr '\n' ' ' \
            | tr '(' '[' \
            | tr ')' ']' \
            | sed "s/[\`\$\"'\\\\]//g" \
            | tr -s ' ')
          # TestFlight "What to Test" caps at 4000 chars.
          NOTES=$(printf '%s' "$NOTES" | head -c 4000)
          echo "Resolved notes: $NOTES"
          set-output notes "$NOTES"

          # Cache feature builds (release/*) and manual runs; master stays uncached
          # for clean from-scratch builds. master also ships the AAB to Play, so it's
          # the "production" build type; everything else is "staging".
          if [[ "$REF_NAME" == release/* || "$EVENT_NAME" == "workflow_dispatch" ]]; then
            set-output android_profile "staging-cached"
            set-output build_type "staging"
          else
            set-output android_profile "staging-base"
            set-output build_type "production"
          fi

  build_ios:
    name: Build iOS
    type: build
    needs: [prepare]
    params:
      platform: ios
      profile: staging-base
      message: ${{ needs.prepare.outputs.notes }}

  build_android:
    name: Build APK
    type: build
    needs: [prepare]
    params:
      platform: android
      profile: ${{ needs.prepare.outputs.android_profile }}
      message: ${{ needs.prepare.outputs.notes }}

  build_android_play:
    name: Build AAB (Play)
    type: build
    needs: [prepare]
    if: ${{ github.ref_name == 'master' }}
    params:
      platform: android
      profile: production
      message: ${{ needs.prepare.outputs.notes }}

  # Scans the native dependency graphs the builds captured via buildArtifactPaths;
  # blocks distribution on production builds, warns on staging.
  security_gate:
    name: Native dependency gate
    needs: [prepare, build_ios, build_android]
    # `needs` on a skipped job skips the dependent, and the bundle is master-only.
    after: [build_android_play]
    runs_on: linux-medium
    # Holds EXPO_TOKEN and SONATYPE_TOKEN.
    environment: production
    outputs:
      summary: ${{ steps.gate.outputs.summary }}
    steps:
      - uses: eas/checkout
      # The only step with EXPO_TOKEN, and it only downloads. Fails softly: the
      # scan step records the verdict, so a missing capture reaches the same one.
      - name: Download what the builds captured
        run: |
          export EXPO_TOKEN="${{ env.EXPO_TOKEN }}"
          unset SONATYPE_TOKEN

          # By status: a missing output interpolates as the literal `undefined`.
          set -- --ios "${{ needs.build_ios.outputs.build_id }}"
          set -- "$@" --android "${{ needs.build_android.outputs.build_id }}"
          if [ "${{ after.build_android_play.status }}" = "success" ]; then
            set -- "$@" --aab "${{ after.build_android_play.outputs.build_id }}"
          fi
          echo "capturing: $*"

          set +e
          node --permission \
            --allow-fs-read="scripts/native-audit/*" \
            --allow-fs-write="capture/*" \
            scripts/native-audit/fetch-graphs.mjs --out capture "$@"
          code=$?
          set -e
          echo "capture exit: $code"
      # Records a verdict instead of failing, so the upload below runs either way.
      # `unset EXPO_TOKEN`: EAS scopes secrets per job, not per step.
      - name: Parse and scan the resolved graphs
        id: gate
        run: |
          unset EXPO_TOKEN
          export SONATYPE_TOKEN="${{ env.SONATYPE_TOKEN }}"
          BUILD_TYPE="${{ needs.prepare.outputs.build_type }}"
          echo "build type: $BUILD_TYPE"
          mkdir -p native-graphs

          audit() {
            node --permission \
              --allow-fs-read="scripts/native-audit/*" \
              --allow-fs-read="capture/*" \
              --allow-fs-read="native-graphs/*" \
              --allow-fs-write="native-graphs/*" \
              scripts/native-audit/index.mjs "$@"
          }

          set +e
          (
            set -e
            audit parse --ios capture/Podfile.lock \
              --build-meta capture/build-ios.json --out native-graphs/ios-pods.json
            audit parse --android capture/sdkDependencies.txt \
              --build-meta capture/build-android.json --out native-graphs/android-coordinates.json
            set -- --graph native-graphs/android-coordinates.json

            # A bundle that built and left no graph must fail, not scan the APK alone.
            if [ "${{ after.build_android_play.status }}" = "success" ]; then
              audit parse --aab capture/dependencies.pb \
                --build-meta capture/build-aab.json --out native-graphs/aab-coordinates.json
              set -- "$@" --graph native-graphs/aab-coordinates.json
            fi

            audit gate "$@" \
              --pods native-graphs/ios-pods.json \
              --markdown native-graphs/native-dependencies.md \
              --summary native-graphs/summary.txt
          )
          code=$?
          set -e
          cat native-graphs/native-dependencies.md 2> /dev/null || true

          # Stripped for the same reason `prepare` strips them.
          SUMMARY=$(sed "s/[()\`\$\"'\\\\]//g" native-graphs/summary.txt 2> /dev/null || true)
          set-output summary "${SUMMARY:-the native dependency scan did not finish - read the job log}"

          # Findings and scan failures share this path — neither may pass silently.
          if [ "$code" -eq 0 ]; then
            set-output verdict "pass"
          elif [ "$BUILD_TYPE" = "production" ]; then
            set-output verdict "block"
          else
            echo "not blocking a $BUILD_TYPE build"
            set-output verdict "warn"
          fi
      - uses: eas/upload_artifact
        with:
          type: other
          name: native-dependency-graphs
          # Globbed from the checkout root, not from the step's working directory
          # (which eas/checkout moved to apps/mobile, where the graphs are written).
          # `working_directory:` would not help — the function ignores it.
          path: apps/mobile/native-graphs/**/*
          # A scan that failed early leaves nothing to upload.
          ignore_error: true
      - name: Block distribution
        run: |
          if [ "${{ steps.gate.outputs.verdict }}" = "block" ]; then
            echo "the native dependency gate did not pass - see the report above"
            exit 1
          fi

  submit_android_play:
    name: Submit to Google Play (internal)
    type: submit
    needs: [build_android_play, security_gate]
    if: ${{ github.ref_name == 'master' }}
    params:
      build_id: ${{ needs.build_android_play.outputs.build_id }}
      profile: production
    # Temporary: surfaces the real "failed to resolve submission config" cause.
    # Remove once the submit succeeds.
    env:
      EXPO_DEBUG: '1'

  distribute_ios:
    type: testflight
    name: Upload to TestFlight
    needs: [prepare, build_ios, security_gate]
    params:
      build_id: ${{ needs.build_ios.outputs.build_id }}
      profile: production
      changelog: ${{ needs.prepare.outputs.notes }}

  # testflight upload may fail with unknown at this moment reasons, but retry should help.
  distribute_ios_crutch:
    type: testflight
    name: Upload to TestFlight (crutch)
    after: [build_ios, distribute_ios, security_gate]
    # `after` ignores upstream status, so security_gate needs an explicit check.
    if: ${{ after.distribute_ios.status == 'failure' && after.security_gate.status == 'success' }}
    params:
      build_id: ${{ after.build_ios.outputs.build_id }}
      profile: production

  # Runs on the APK from build_android (no separate e2e build).
  # The flows are a chain — each starts from the state the previous one left
  # (onboarding -> add wallets -> import wallet -> send), so the order below
  # matters. The flows read MAESTRO_SEED_PHRASE / MAESTRO_IMPORTED_WALLET_ADDRESS /
  # MAESTRO_WATCH_ONLY_ADDRESS / MAESTRO_RECIPIENT_ADDRESS from the EAS
  # environment (Maestro exposes MAESTRO_-prefixed env vars to flows).
  e2e_android:
    name: E2E (Maestro, Android)
    type: maestro
    needs: [build_android]
    params:
      build_id: ${{ needs.build_android.outputs.build_id }}
      flow_path:
        [
          '.maestro/onboarding-create-wallet.yaml',
          '.maestro/create-wallet.yaml',
          '.maestro/add-watch-only.yaml',
          '.maestro/import-wallet.yaml',
          '.maestro/send-asset.yaml',
        ]

  # Aggregates TestFlight + Android build + e2e results into a Slack message.
  # `after` => runs regardless of upstream success/failure, and lets us read
  # both the statuses and the build outputs (version / build number).
  report:
    name: Report (Slack)
    after:
      - prepare
      - build_ios
      - build_android
      - security_gate
      - distribute_ios
      - distribute_ios_crutch
      - e2e_android
    steps:
      # Custom steps jobs start with an empty workdir — check out the repo to reach the script.
      - uses: eas/checkout
      - name: Post report
        run: |
          export RELEASE_NOTES="${{ after.prepare.outputs.notes }}"
          export BUILD_TYPE="${{ after.prepare.outputs.build_type }}"
          export SLACK_WEBHOOK_URL="${{ env.SLACK_WEBHOOK_URL }}"
          export WORKFLOW_URL="${{ workflow.url }}"
          export REPOSITORY="${{ github.repository }}"
          export COMMIT_SHA="${{ github.sha }}"
          export TARGET_BRANCH="${{ github.ref_name }}"
          export IOS_VERSION="${{ after.build_ios.outputs.app_version }}"
          export IOS_BUILD="${{ after.build_ios.outputs.app_build_version }}"
          export ANDROID_VERSION="${{ after.build_android.outputs.app_version }}"
          export ANDROID_BUILD="${{ after.build_android.outputs.app_build_version }}"
          export STATUS_IOS="${{ after.distribute_ios.status }}"
          export STATUS_IOS_CRUTCH="${{ after.distribute_ios_crutch.status }}"
          export STATUS_ANDROID="${{ after.build_android.status }}"
          export STATUS_E2E="${{ after.e2e_android.status }}"
          export STATUS_SECURITY="${{ after.security_gate.status }}"
          export SECURITY_SUMMARY="${{ after.security_gate.outputs.summary }}"
          node scripts/eas-report.mjs
