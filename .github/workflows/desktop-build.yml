name: Desktop build

# Builds the Mac App Store package, signs it with the distribution identities and uploads it to App
# Store Connect, where TestFlight hands it to the internal testers. Called by `desktop-staging.yml`
# (a push to `release/*`) and `desktop-release.yml` (the merge of a release into master), never on
# its own. This pipeline is the only place the distribution keys exist — no machine signs a store
# build locally — so the two jobs that touch them are split by what they hold: `build` has the
# certificates and no API key, `upload` has the API key and no certificates.
# `.claude/rules/desktop-signing.md` has the setup.
#
# No `concurrency` here: each caller puts its `uses:` job into the `desktop-build` group, so a caller
# that decides to build nothing never waits in the group or evicts a run pending in it.

on:
  workflow_call:
    inputs:
      report-success:
        # The release caller posts its own success, which names the GitHub release as well.
        description: Post a Slack report for a fully successful run too, not only for a failure
        type: boolean
        default: true
      release-tag:
        # Set by the release caller, so a failure says which GitHub release it left unpublished.
        description: The GitHub release this build is for; empty for a TestFlight-only build
        type: string
        default: ''
    outputs:
      number:
        value: ${{ jobs.allocate-build-number.outputs.number }}
      artifact:
        value: ${{ jobs.allocate-build-number.outputs.artifact }}
    secrets:
      BUILD_NUMBER_TOKEN:
        required: true
      SLACK_WEBHOOK_URL:
        required: false
      APPLE_MAS_APP_CERT_P12:
        required: true
      APPLE_MAS_INSTALLER_CERT_P12:
        required: true
      APPLE_MAS_CERT_PASSWORD:
        required: true
      APPLE_MAS_PROVISIONING_PROFILE:
        required: true
      ASC_API_KEY_P8:
        required: true
      ASC_API_KEY_ID:
        required: true
      ASC_API_ISSUER_ID:
        required: true

permissions:
  contents: read

jobs:
  # Never `${{ vars.* }}`: that context is fixed when the run is created, before a queued run's turn.
  allocate-build-number:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    outputs:
      number: ${{ steps.number.outputs.number }}
      artifact: ${{ steps.number.outputs.artifact }}
    steps:
      - name: Allocate build number
        id: number
        env:
          GH_TOKEN: ${{ secrets.BUILD_NUMBER_TOKEN }}
        run: |
          set -euo pipefail

          if [ -z "${GH_TOKEN:-}" ]; then
            echo "BUILD_NUMBER_TOKEN is unset, so the counter cannot be read" >&2
            exit 1
          fi

          # No fallback to 0: a PAT that lost access to the repository answers 404 as well.
          current="$(gh api "repos/$GITHUB_REPOSITORY/actions/variables/DESKTOP_BUILD_NUMBER_MACOS" \
            --jq .value)"

          case "$current" in
            '' | *[!0-9]*)
              echo "DESKTOP_BUILD_NUMBER_MACOS is not a whole number: '$current'" >&2
              exit 1
              ;;
          esac

          number=$((current + 1))

          echo "Build $number of ${GITHUB_SHA:0:7}"
          echo "number=$number" >> "$GITHUB_OUTPUT"
          echo "artifact=safely-desktop-mas-b$number-${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"

  build:
    needs: allocate-build-number
    # macos-15 is arm64: the same architecture as the native addon.
    runs-on: macos-15
    # Restrict the environment's branches there, not here — a run on any other ref then cannot read
    # its secrets. This job references the certificates only.
    environment: desktop-release
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          run_install: false

      # No dependency or Electron cache on purpose: a cache is writable from every branch, and this
      # job holds the distribution certificates. Five minutes of download beats a poisonable input.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # `make` in one app does not run web-ui's codegen, and the renderer imports styled-system.
      - name: Generate styled-system
        run: pnpm --filter @safely/web-ui run codegen

      # The release's record of what actually shipped — the macOS counterpart of mobile's
      # android-sdkDependencies.txt. Resolved from the frozen lockfile just installed above.
      - name: List resolved dependencies
        env:
          NUMBER: ${{ needs.allocate-build-number.outputs.number }}
        run: |
          set -euo pipefail
          version="$(jq -r .version apps/desktop/package.json)"
          {
            echo "Safely desktop $version — build $NUMBER (${GITHUB_SHA:0:7})"
            echo
            echo "Electron:"
            pnpm --filter @safely/desktop list electron --depth 0
            echo
            echo "Production dependencies:"
            pnpm --filter @safely/desktop list --prod --depth Infinity
          } > "$RUNNER_TEMP/desktop-dependencies.txt"

      - name: Import signing identities
        id: identity
        env:
          APP_CERT_P12: ${{ secrets.APPLE_MAS_APP_CERT_P12 }}
          INSTALLER_CERT_P12: ${{ secrets.APPLE_MAS_INSTALLER_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.APPLE_MAS_CERT_PASSWORD }}
          PROVISIONING_PROFILE: ${{ secrets.APPLE_MAS_PROVISIONING_PROFILE }}
        run: |
          set -euo pipefail

          keychain="$RUNNER_TEMP/signing.keychain-db"
          password="$(openssl rand -base64 24)"

          printf '%s' "$APP_CERT_P12" | base64 --decode > "$RUNNER_TEMP/app.p12"
          printf '%s' "$INSTALLER_CERT_P12" | base64 --decode > "$RUNNER_TEMP/installer.p12"
          printf '%s' "$PROVISIONING_PROFILE" | base64 --decode > apps/desktop/signing/ci.provisionprofile

          security create-keychain -p "$password" "$keychain"
          # codesign and productbuild resolve an identity through the search list; --keychain alone is not enough.
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          # No flags on purpose: the keychain must not relock while packaging is still signing.
          security set-keychain-settings "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          # -x: the private keys cannot be exported again, only used — and only by these two tools.
          for p12 in app installer; do
            security import "$RUNNER_TEMP/$p12.p12" -k "$keychain" -P "$CERT_PASSWORD" \
              -T /usr/bin/codesign -T /usr/bin/productbuild -x
          done
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain" > /dev/null
          rm -f "$RUNNER_TEMP/app.p12" "$RUNNER_TEMP/installer.p12"

          # A truncated secret decodes to a file that only fails deep inside packaging.
          security cms -D -i apps/desktop/signing/ci.provisionprofile > /dev/null

          # Exactly one identity of each kind, matched by kind rather than taken as found: a
          # development or Developer ID certificate in the secret signs fine and is refused only by
          # App Store Connect, after the whole build.
          identities="$(security find-identity -v "$keychain" | sed -n 's/.*"\(.*\)"/\1/p')"
          pick() {
            local found count
            found="$(printf '%s\n' "$identities" | grep "^$1: " || true)"
            count="$(printf '%s' "$found" | grep -c . || true)"
            if [ "$count" != "1" ]; then
              echo "Expected exactly one '$1' identity in the imported keychain, found $count" >&2
              exit 1
            fi
            printf '%s' "$found"
          }
          app="$(pick '3rd Party Mac Developer Application')"
          installer="$(pick '3rd Party Mac Developer Installer')"

          echo "Signing the app as: $app"
          echo "Signing the package as: $installer"
          echo "app=$app" >> "$GITHUB_OUTPUT"
          echo "installer=$installer" >> "$GITHUB_OUTPUT"
          echo "keychain=$keychain" >> "$GITHUB_OUTPUT"

      - name: Make the App Store package
        env:
          # Naming an identity is what turns signing on; the profile is mandatory with it.
          SAFELY_SIGN_IDENTITY: ${{ steps.identity.outputs.app }}
          # Relative to apps/desktop: forge resolves it from the package directory.
          SAFELY_SIGN_PROFILE: signing/ci.provisionprofile
          SAFELY_SIGN_KEYCHAIN: ${{ steps.identity.outputs.keychain }}
          SAFELY_INSTALLER_IDENTITY: ${{ steps.identity.outputs.installer }}
          # Becomes CFBundleVersion and the About panel's build number; a build without it says `local`.
          SAFELY_BUILD_NUMBER: ${{ needs.allocate-build-number.outputs.number }}
        run: pnpm --filter @safely/desktop run make:mas

      # The store's guarantees are properties of this signature, so a build that fails here must not
      # be uploaded. Whether securityd honours it is only visible when the app runs.
      - name: Verify signatures
        run: |
          set -euo pipefail

          apps/desktop/signing/verify-signature.sh apps/desktop/out/Safely-mas-arm64/Safely.app

          pkgs=(apps/desktop/out/make/*.pkg)
          if [ ${#pkgs[@]} != 1 ] || [ ! -f "${pkgs[0]}" ]; then
            echo "Expected exactly one .pkg in out/make, found: ${pkgs[*]}" >&2
            exit 1
          fi
          pkgutil --check-signature "${pkgs[0]}"
          cp "${pkgs[0]}" "$RUNNER_TEMP/Safely.pkg"

      # The handover to `upload` and to desktop-release.yml's `release`; 3 days to re-run the latter.
      - name: Store the package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ needs.allocate-build-number.outputs.artifact }}
          path: |
            ${{ runner.temp }}/Safely.pkg
            ${{ runner.temp }}/desktop-dependencies.txt
          if-no-files-found: error
          retention-days: 3

      - name: Remove signing identities
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
          rm -f apps/desktop/signing/ci.provisionprofile

  # A job of its own so the API key and the certificates never share a runner: the environment holds
  # both, but a job receives only the secrets it references, and this one references the key only.
  upload:
    needs: [allocate-build-number, build]
    runs-on: macos-15
    environment: desktop-release
    timeout-minutes: 30
    permissions: {}
    steps:
      - name: Fetch the package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.allocate-build-number.outputs.artifact }}
          path: ${{ runner.temp }}/package

      # altool looks the key up by id in a fixed set of directories; it takes no path to the file.
      - name: Install the API key
        env:
          API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
          API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
        run: |
          set -euo pipefail
          mkdir -p ~/.appstoreconnect/private_keys
          printf '%s' "$API_KEY_P8" > ~/.appstoreconnect/private_keys/AuthKey_"$API_KEY_ID".p8
          chmod 600 ~/.appstoreconnect/private_keys/AuthKey_"$API_KEY_ID".p8

      # Validation first: it reports what App Store Connect would refuse — a missing icon size, an
      # entitlement the profile does not grant, a reused build number — without consuming anything.
      - name: Validate
        env:
          API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
        run: |
          xcrun altool --validate-app -t macos -f "$RUNNER_TEMP/package/Safely.pkg" \
            --apiKey "$API_KEY_ID" --apiIssuer "$API_ISSUER_ID"

      - name: Upload to App Store Connect
        env:
          API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
        run: |
          xcrun altool --upload-app -t macos -f "$RUNNER_TEMP/package/Safely.pkg" \
            --apiKey "$API_KEY_ID" --apiIssuer "$API_ISSUER_ID"

      - name: Remove the API key
        if: always()
        run: rm -rf ~/.appstoreconnect

  # A separate job because writing a repository variable needs a token, and a token that can write
  # to the repository must sit in neither of the jobs above. Depending on `upload` is what makes a
  # number belong to a build App Store Connect has.
  record-build-number:
    needs: [allocate-build-number, upload]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Record the build number
        env:
          GH_TOKEN: ${{ secrets.BUILD_NUMBER_TOKEN }}
          NUMBER: ${{ needs.allocate-build-number.outputs.number }}
        run: |
          set -euo pipefail

          if [ -z "${GH_TOKEN:-}" ]; then
            echo "BUILD_NUMBER_TOKEN is unset, so the next build would be numbered $NUMBER again" >&2
            exit 1
          fi

          gh variable set DESKTOP_BUILD_NUMBER_MACOS --repo "$GITHUB_REPOSITORY" --body "$NUMBER"
          echo "DESKTOP_BUILD_NUMBER_MACOS is now $NUMBER"

  # Runs whatever the other jobs did, so a crash is reported too. Separate job on ubuntu: the webhook
  # is a repository secret, and it has no business sitting next to the certificates or the API key.
  # It waits for the counter as well: a build that reached Apple with the counter left behind makes
  # the next run fail as a duplicate, and that has to be said now, not discovered then.
  report:
    needs: [allocate-build-number, build, upload, record-build-number]
    if: >-
      always() && (inputs.report-success || needs.upload.result != 'success'
      || needs.record-build-number.result != 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Compose the status
        id: status
        env:
          ALLOCATE_RESULT: ${{ needs.allocate-build-number.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          UPLOAD_RESULT: ${{ needs.upload.result }}
          RECORD_RESULT: ${{ needs.record-build-number.result }}
          BUILD_NUMBER: ${{ needs.allocate-build-number.outputs.number }}
          RELEASE_TAG: ${{ inputs.release-tag }}
          # Optional: the App Store Connect app id, which turns the link into its TestFlight page.
          ASC_APP_ID: ${{ vars.DESKTOP_ASC_APP_ID }}
        run: |
          set -euo pipefail

          # Read here rather than passed from `build`: a job that failed before checkout still reports it.
          version="$(jq -r .version apps/desktop/package.json)"
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          url="$run_url"

          # App Store Connect refuses a build number it has seen, so every outcome where Apple may
          # hold this number but the counter does not says how to move the counter on.
          if [ "$UPLOAD_RESULT" = "success" ] && [ "$RECORD_RESULT" = "success" ]; then
            status="✅ Uploaded to TestFlight $version (${BUILD_NUMBER:-?})"
            if [ -n "${ASC_APP_ID:-}" ]; then
              url="https://appstoreconnect.apple.com/apps/$ASC_APP_ID/testflight/macos"
            fi
          elif [ "$UPLOAD_RESULT" = "success" ]; then
            status="⚠️ Uploaded $version (${BUILD_NUMBER:-?}), but DESKTOP_BUILD_NUMBER_MACOS was not advanced — set it to ${BUILD_NUMBER:-?} before the next run"
            if [ -n "$RELEASE_TAG" ]; then
              status="$status; $RELEASE_TAG is not published — then Re-run failed jobs on this run"
            fi
          elif [ "$BUILD_RESULT" = "success" ]; then
            status="❌ Desktop upload failed — if App Store Connect shows build ${BUILD_NUMBER:-?} anyway, set DESKTOP_BUILD_NUMBER_MACOS to it; retry with Re-run all jobs"
          elif [ "$ALLOCATE_RESULT" != "success" ]; then
            status="❌ Desktop build number could not be read — check BUILD_NUMBER_TOKEN and DESKTOP_BUILD_NUMBER_MACOS"
          else
            status="❌ Desktop build failed — retry with Re-run all jobs"
          fi

          if [ -n "$RELEASE_TAG" ] && [ "$UPLOAD_RESULT" != "success" ]; then
            status="$status — $RELEASE_TAG is not published"
          fi

          echo "status=$status" >> "$GITHUB_OUTPUT"
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Post the build status to Slack
        uses: ./.github/actions/desktop-slack-report
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          status: ${{ steps.status.outputs.status }}
          url: ${{ steps.status.outputs.url }}
