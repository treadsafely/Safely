name: Claude Security Review

on:
  pull_request:
    types: [opened, ready_for_review, reopened]
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  issues: read
  id-token: write

concurrency:
  group: claude-review-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: false

jobs:
  review:
    # Runs only if:
    # 1. A non-fork PR is opened / converted from draft / reopened
    # 2. A repository member comments "@claude review" in the PR
    # The job checks out the PR head and loads its .claude/ settings with secrets in scope, so
    # fork code must never reach it: a fork's hooks would run next to ANTHROPIC_API_KEY.
    if: |
      (github.event_name == 'pull_request' &&
       github.event.pull_request.draft == false &&
       github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request != null &&
       contains(github.event.comment.body, '@claude review') &&
       github.event.comment.user.type != 'Bot' &&
       contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association))

    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      CLAUDE_CODE_MAX_OUTPUT_TOKENS: '16000'
      MAX_THINKING_TOKENS: '12000'
      DISABLE_TELEMETRY: '1'

    steps:
      # issue_comment carries no head repo, so a fork PR is only detectable through the API.
      - name: Refuse fork PRs
        if: github.event_name == 'issue_comment'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          cross=$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json isCrossRepository --jq .isCrossRepository)
          if [ "$cross" != "false" ]; then
            echo "::error::Claude review does not run on fork PRs"
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || format('refs/pull/{0}/head', github.event.issue.number) }}

      - name: Prepare PR diff for the reviewer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
          REPO_FULL: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh pr diff "$PR_NUMBER" --repo "$REPO_FULL" \
            > "$GITHUB_WORKSPACE/.pr-diff.patch"
          gh pr view "$PR_NUMBER" --repo "$REPO_FULL" \
            --json title,body,files,additions,deletions \
            > "$GITHUB_WORKSPACE/.pr-meta.json"
          ADDITIONS=$(jq -r '.additions' "$GITHUB_WORKSPACE/.pr-meta.json")
          DELETIONS=$(jq -r '.deletions' "$GITHUB_WORKSPACE/.pr-meta.json")
          TOTAL=$((ADDITIONS + DELETIONS))
          echo "PR_DIFF_SIZE=$TOTAL" >> "$GITHUB_ENV"
          echo "Diff size: $TOTAL lines (additions=$ADDITIONS, deletions=$DELETIONS)"

      - id: claude
        uses: anthropics/claude-code-action@cfc3eb22bfed5c26ef66e3223c982af27e4524de # v1.0.231
        timeout-minutes: 18
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_args: |
            --model claude-sonnet-4-6
            --max-turns 12
            --setting-sources project
            --allowedTools "Read,Write,Grep,Glob,mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr view:*),Bash(git show:*),Bash(git diff:*),Bash(git log:*)"
            --disallowedTools "Task,Agent,Skill,WebSearch,WebFetch,ToolSearch,ScheduleWakeup,EnterPlanMode,ExitPlanMode,EnterWorktree,ExitWorktree,CronCreate,CronDelete,CronList,Monitor,RemoteTrigger,PushNotification,NotebookEdit,AskUserQuestion"
          use_sticky_comment: true
          show_full_output: true
          prompt: |
            You are a senior reviewer for a React Native + TypeScript mobile app.
            Job: catch CRITICAL issues. Bias hard toward silence — a clean PR
            gets one short approval line. Critical-issue scan on the diff
            comes FIRST and gets the budget; structural sweeps are secondary
            and only run if budget remains.

            ## Diff source (do NOT fetch it yourself)
            The full PR diff is on disk at $GITHUB_WORKSPACE/.pr-diff.patch.
            PR metadata (files, additions, deletions, title, body) is at
            $GITHUB_WORKSPACE/.pr-meta.json. Read these with the `Read` tool.
            Do NOT call `gh pr diff` or `gh api` — the data is already local.

            ## Hard skips — never Read, Grep, Glob, or comment on these
            *.test.ts(x), *.spec.ts(x), *.snap, *.generated.ts(x),
            __mocks__/**, **/*.mock.ts(x), **/*.fixture.ts(x), fixtures/**,
            __fixtures__/**, __tests__/**, e2e/**, locales/**,
            ios/Pods/**, android/build/**, node_modules/**, dist/**, build/**
            Tests, mocks, snapshots, and fixtures are OUT OF SCOPE entirely —
            do not open them, do not consider them as siblings, do not flag
            them as missed parallel sites. If the diff only touches such
            files, treat it as a clean PR.

            ## Procedure (strict order)
            1. Read DIFF_FILE and META_FILE.
            2. PHASE 1 — Critical scan on the diff itself (SECURITY,
               PERFORMANCE, CORRECTNESS, DATA INTEGRITY).
               This is the primary pass. Spend the bulk of the budget here.
            3. PHASE 2 — Only after Phase 1 is done AND budget remains, run
               structural sweeps (SYMMETRY, IDENTIFIER DRIFT, CONTRACT
               COVERAGE). Skip Phase 2 entirely if Phase 1 already produced
               critical findings near the inline cap, or if turn/tool
               budget is tight.
            4. ALWAYS finish by writing the summary file. Producing the
               summary file matters more than completing Phase 2.

            ## Tool budget caps (hard)
            - ≤ 8 Grep calls total
            - ≤ 12 Read calls beyond DIFF_FILE / META_FILE
            - ≤ 4 Glob calls
            Stay inside these even on large PRs.

            ## Phase 1 — CRITICAL classes
            SECURITY — data leaks, code exec, auth bypass, weak transport,
              hardcoded secrets, missing auth/session check on sensitive screen.
            PERFORMANCE — jank, freezes, leaks, JS-thread blocking, bridge
              thrashing, unbounded list rendering, missing cleanup.
            CORRECTNESS — wrong logic, races, `!`/`as` that hides a real
              null/cast bug, conditional hooks, stale closures, floating
              promises in user-facing flows, iOS/Android API w/o Platform.OS,
              swallowed errors (`catch {}`, `.catch(noop)`), `default:` in
              switch hiding an unhandled enum branch, off-by-one, money in
              `number` / unit mismatch (cents vs dollars, sat vs btc),
              timezone/DST boundary bugs.
            DATA INTEGRITY — mmkv/keychain bugs, broken or re-runnable
              migrations, optimistic updates without rollback, state mutation,
              storage version bump without migration (or vice versa),
              `setState` after `await` without mount/abort guard.
            Mobile surfaces of concern: native bridge, deep links, WebViews,
            async storage, permissions, network transport, third-party SDKs.

            ## Phase 2 — Structural sweeps (secondary, budget-permitting)
            SYMMETRY / PARALLEL SITES — diff changed one of a pair, the
            sibling not updated. Candidates:
            - mapper pairs (toDto/fromDto, encode/decode, serialize/deserialize)
            - Platform.OS branches; *.ios.ts(x) / *.android.ts(x) twins;
              light/dark theme variants
            - XState v5 (project is on v5): event handled in some states
              but not in siblings where it should be reachable; guard/action
              declared in `setup()` but never referenced in transitions;
              `target:` pointing at a non-existent state; new `invoke`/actor
              without `onError`.
            - Form: field added to schema but missing in `initialValues` /
              `onSubmit` / reset, or vice versa.
            - Symmetric ops: subscribe/unsubscribe, add/remove, push/pop,
              lock/unlock, migration up/down.
            - pnpm catalog: dep added to a workspace `package.json` while
              the same name exists in another workspace or in
              `pnpm-workspace.yaml` `catalog:` — must be `"catalog:"` (or
              moved to the catalog), not a raw version.
            Procedure: for each twin-candidate file in the diff, `Glob` the
            same dir and platform/theme variants, `Read` the matched
            non-test files only, verify parallel change. Never open
            test/mock/fixture files even when looking for siblings.

            IDENTIFIER DRIFT — if the diff renames or removes an exported
            name, enum value, MMKV/keychain key, route name, deep-link
            scheme/host, analytics event, react-query key, or feature flag
            → `Grep` the OLD name across the repo. Residual hits outside
            the diff and outside the skip list are bugs (compiler missed
            them: string literals, fallback branches, `default:`).

            CONTRACT COVERAGE — if the diff changes a DTO/type shape
            (added/removed/renamed field, optionality change) → `Grep`
            consumers (decoders, mappers, form schemas, selectors). Each
            consumer outside the skip list must be in the diff or proven
            irrelevant.

            ## Severity bar (examples — not exhaustive)
            - Secrets/tokens hardcoded in JS or bundled .env
            - Auth tokens / PII in AsyncStorage instead of Keychain/SecureStore
            - WebView with `originWhitelist={['*']}`, `allowFileAccess`, or
              `injectedJavaScript` on untrusted content
            - Deep link handler executing actions w/o scheme/host validation
            - HTTP endpoints, disabled SSL pinning, `cleartextTrafficPermitted=true`
            - `console.log` of tokens / full bodies / PII in production
            - `ScrollView` + `.map()` over growing data; `FlatList` w/o stable
              `keyExtractor`; inline functions in `renderItem` / context value
            - `Animated` transform/opacity without `useNativeDriver: true`
            - `useEffect` with object/array literal in deps
            - Subscription/timer/listener/AppState handler without cleanup
            - Per-frame JS↔Native calls in gestures instead of worklets
            - Migration that can run twice; optimistic update w/o rollback
            - Reducer mutating state instead of returning new object
            - Forgotten mirror: mapper updated one direction only; XState
              event handled in `idle` but not in `editing`; form field in
              schema but missing in `onSubmit`.

            ## DO NOT comment on
            Naming/casing/formatting/import order/ESLint, "consider renaming/
            extracting/refactoring", readability/JSDoc, `React.memo`/`useMemo`/
            `useCallback` w/o evidence of a real perf hit, test coverage,
            `any` or `type` vs `interface` (unless actively hiding a bug),
            Nit/Minor/Optional, praise, summaries of what code does,
            architecture opinions, library choice, StyleSheet vs inline.
            Anything you are not >85% confident is real → silent OR (for
            Phase 2 only, at 50-85% confidence) goes to QUESTIONS, not inline.

            ## Decide before posting
            1. Will this cause real harm to a user (data, crash, jank, corruption)?
            2. >85% confident it's real, not a preference or speculation?
            3. ≥ severity of examples above?
            Any "no" → silent. Exception: Phase 2 findings at 50-85% confidence
            may go to the QUESTIONS list (non-blocking, top-level only).

            ## Output rules
            - CRITICAL inline: `mcp__github_inline_comment__create_inline_comment`
              (with `confirmed: true`), anchored to exact line.
              One sentence: issue + concrete fix (short snippet if it helps).
            - Max 7 inline comments — keep the 7 most severe.
            - QUESTIONS (optional, non-blocking): if any Phase 2 findings
              are 50-85% confidence, post ONE additional top-level comment
              via `gh pr comment` in this exact format:
                ### Questions (not blocking)
                - `path/file.ts:LINE` — one-sentence concern
              Max 5 entries. ONLY for symmetry/drift/contract concerns at
              50-85% confidence. Never praise, style nits, or "consider...".
              If a Phase 2 finding is >85% confident → it's CRITICAL inline,
              not a question.
            - If no qualifying critical issues, post exactly ONE top-level
              comment via `gh pr comment`: "No security, performance, or
              correctness issues found." (Still post a separate QUESTIONS
              comment if any.)
            - Do NOT submit the review as a plain assistant message.
            - Never list what you checked or what looks good.

            ## Required summary file
            Before finishing, `Write` to $GITHUB_WORKSPACE/.claude-review.json:
            {
              "critical": <int>,
              "items": [ {"file":"<path>","line":<int>,"summary":"<one sentence>"} ],
              "questions": [ {"file":"<path>","line":<int>,"summary":"<one sentence>"} ]
            }
            `critical` = number of CRITICAL inline comments posted (does NOT
            include questions). Always create the file; empty case is
            `{"critical": 0, "items": [], "questions": []}`. Invalid JSON or
            a missing file fails the pipeline. Writing this file is more
            important than finishing Phase 2.

            ## Run context (last — keep above stable for prompt cache)
            REPO: ${{ github.repository }}
            PR: ${{ github.event.pull_request.number || github.event.issue.number }}
            DIFF_FILE: $GITHUB_WORKSPACE/.pr-diff.patch
            META_FILE: $GITHUB_WORKSPACE/.pr-meta.json

      - name: Enforce critical findings gate
        if: always() && steps.claude.outcome != 'cancelled' && steps.claude.outcome != 'skipped'
        run: |
          set -euo pipefail
          f="$GITHUB_WORKSPACE/.claude-review.json"
          if [ ! -f "$f" ]; then
            echo "::error::Claude review did not produce $f — failing the gate."
            exit 1
          fi
          if ! jq -e . "$f" >/dev/null 2>&1; then
            echo "::error::$f is not valid JSON."
            cat "$f" || true
            exit 1
          fi
          critical=$(jq -r '.critical // 0' "$f")
          echo "Claude review summary: critical=$critical"
          if [ "$critical" -gt 0 ]; then
            echo "::error::Claude review found $critical critical issue(s) — failing the pipeline."
            jq '.items[]? | select(.severity=="critical")' "$f" || true
            exit 1
          fi
