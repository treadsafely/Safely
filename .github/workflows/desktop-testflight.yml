name: Desktop TestFlight

# Builds the Mac App Store package, signs it with the distribution identities and uploads it to App
# Store Connect, where TestFlight hands it to the internal testers; from master it also publishes the
# GitHub release. This pipeline is the only place the distribution keys exist — no machine signs a
# store build locally — so the two jobs that touch them are split by what they hold: `build` has the
# certificates and no API key, `upload` has the API key and no certificates.
# `.claude/rules/desktop-signing.md` has the setup.

on:
  # A merge is a push, and it builds unattended: what may reach either branch is decided by the
  # rulesets on `master` and `release/*`, not by an approval here. The pattern matches the ruleset's
  # exactly — `*` stops at `/`, so `release/**` would also build branches the ruleset does not
  # protect. The `desktop-release` environment has to allow both refs too. A release branch is
  # TestFlight only; master is the release, once per desktop version — see `prepare`.
  push:
    branches:
      - master
      - 'release/*'
  workflow_dispatch:

permissions:
  contents: read

# One counter for every run, so two of them must not read it before either has written it back.
# A running build is never cancelled, but GitHub keeps one pending run per group: a newer push
# replaces the waiting one, so a burst of merges builds the running commit and the latest only.
# The group only orders the runs; desktop-signing.md has why the counter is not read from `vars`.
concurrency:
  group: desktop-testflight
  cancel-in-progress: false

jobs:
  # The same shape as mobile: a push to a release branch is a TestFlight build, the merge into master
  # is the release. Master is built once per desktop version — the first push after the bump, which
  # is that merge — so a dependabot or feature merge that leaves the version alone ends here, with no
  # macOS minutes, no build number and no Slack post. A hand-dispatched run follows the same rule.
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      build: ${{ steps.decide.outputs.build }}
      release: ${{ steps.decide.outputs.release }}
      version: ${{ steps.decide.outputs.version }}
      tag: ${{ steps.decide.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Decide what this ref gets
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          version="$(jq -r .version apps/desktop/package.json)"
          tag="v${version}-desktop"
          build=true
          release=false

          if [ "$GITHUB_REF" = "refs/heads/master" ]; then
            # Only "not found" means no release yet; any other answer must not end in a second build.
            if gh release view "$tag" > /dev/null 2> "$RUNNER_TEMP/gh.err"; then
              echo "::notice::$tag is already published — master builds a desktop version once"
              build=false
            elif grep -q 'release not found' "$RUNNER_TEMP/gh.err"; then
              release=true
            else
              cat "$RUNNER_TEMP/gh.err" >&2
              exit 1
            fi
          fi

          echo "Desktop $version on $GITHUB_REF_NAME: build=$build release=$release"
          echo "build=$build" >> "$GITHUB_OUTPUT"
          echo "release=$release" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  # Never `${{ vars.* }}`: that context is fixed when the run is created, before a queued run's turn.
  allocate-build-number:
    needs: prepare
    if: needs.prepare.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    outputs:
      number: ${{ steps.number.outputs.number }}
      artifact: ${{ steps.number.outputs.artifact }}
    steps:
      - name: Allocate build number
        id: number
        env:
          GH_TOKEN: ${{ secrets.BUILD_NUMBER_TOKEN }}
        run: |
          set -euo pipefail

          if [ -z "${GH_TOKEN:-}" ]; then
            echo "BUILD_NUMBER_TOKEN is unset, so the counter cannot be read" >&2
            exit 1
          fi

          # No fallback to 0: a PAT that lost access to the repository answers 404 as well.
          current="$(gh api "repos/$GITHUB_REPOSITORY/actions/variables/DESKTOP_BUILD_NUMBER_MACOS" \
            --jq .value)"

          case "$current" in
            '' | *[!0-9]*)
              echo "DESKTOP_BUILD_NUMBER_MACOS is not a whole number: '$current'" >&2
              exit 1
              ;;
          esac

          number=$((current + 1))

          echo "Build $number of ${GITHUB_SHA:0:7}"
          echo "number=$number" >> "$GITHUB_OUTPUT"
          echo "artifact=safely-desktop-mas-b$number-${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"

  build:
    needs: allocate-build-number
    # macos-15 is arm64: the same architecture as the native addon.
    runs-on: macos-15
    # Restrict the environment's branches there, not here — a run on any other ref then cannot read
    # its secrets. This job references the certificates only.
    environment: desktop-release
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          run_install: false

      # No dependency or Electron cache on purpose: a cache is writable from every branch, and this
      # job holds the distribution certificates. Five minutes of download beats a poisonable input.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # `make` in one app does not run web-ui's codegen, and the renderer imports styled-system.
      - name: Generate styled-system
        run: pnpm --filter @safely/web-ui run codegen

      # The release's record of what actually shipped — the macOS counterpart of mobile's
      # android-sdkDependencies.txt. Resolved from the frozen lockfile just installed above.
      - name: List resolved dependencies
        env:
          NUMBER: ${{ needs.allocate-build-number.outputs.number }}
        run: |
          set -euo pipefail
          version="$(jq -r .version apps/desktop/package.json)"
          {
            echo "Safely desktop $version — build $NUMBER (${GITHUB_SHA:0:7})"
            echo
            echo "Electron:"
            pnpm --filter @safely/desktop list electron --depth 0
            echo
            echo "Production dependencies:"
            pnpm --filter @safely/desktop list --prod --depth Infinity
          } > "$RUNNER_TEMP/desktop-dependencies.txt"

      - name: Import signing identities
        id: identity
        env:
          APP_CERT_P12: ${{ secrets.APPLE_MAS_APP_CERT_P12 }}
          INSTALLER_CERT_P12: ${{ secrets.APPLE_MAS_INSTALLER_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.APPLE_MAS_CERT_PASSWORD }}
          PROVISIONING_PROFILE: ${{ secrets.APPLE_MAS_PROVISIONING_PROFILE }}
        run: |
          set -euo pipefail

          keychain="$RUNNER_TEMP/signing.keychain-db"
          password="$(openssl rand -base64 24)"

          printf '%s' "$APP_CERT_P12" | base64 --decode > "$RUNNER_TEMP/app.p12"
          printf '%s' "$INSTALLER_CERT_P12" | base64 --decode > "$RUNNER_TEMP/installer.p12"
          printf '%s' "$PROVISIONING_PROFILE" | base64 --decode > apps/desktop/signing/ci.provisionprofile

          security create-keychain -p "$password" "$keychain"
          # codesign and productbuild resolve an identity through the search list; --keychain alone is not enough.
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          # No flags on purpose: the keychain must not relock while packaging is still signing.
          security set-keychain-settings "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          # -x: the private keys cannot be exported again, only used — and only by these two tools.
          for p12 in app installer; do
            security import "$RUNNER_TEMP/$p12.p12" -k "$keychain" -P "$CERT_PASSWORD" \
              -T /usr/bin/codesign -T /usr/bin/productbuild -x
          done
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain" > /dev/null
          rm -f "$RUNNER_TEMP/app.p12" "$RUNNER_TEMP/installer.p12"

          # A truncated secret decodes to a file that only fails deep inside packaging.
          security cms -D -i apps/desktop/signing/ci.provisionprofile > /dev/null

          # Exactly one identity of each kind, matched by kind rather than taken as found: a
          # development or Developer ID certificate in the secret signs fine and is refused only by
          # App Store Connect, after the whole build.
          identities="$(security find-identity -v "$keychain" | sed -n 's/.*"\(.*\)"/\1/p')"
          pick() {
            local found count
            found="$(printf '%s\n' "$identities" | grep "^$1: " || true)"
            count="$(printf '%s' "$found" | grep -c . || true)"
            if [ "$count" != "1" ]; then
              echo "Expected exactly one '$1' identity in the imported keychain, found $count" >&2
              exit 1
            fi
            printf '%s' "$found"
          }
          app="$(pick '3rd Party Mac Developer Application')"
          installer="$(pick '3rd Party Mac Developer Installer')"

          echo "Signing the app as: $app"
          echo "Signing the package as: $installer"
          echo "app=$app" >> "$GITHUB_OUTPUT"
          echo "installer=$installer" >> "$GITHUB_OUTPUT"
          echo "keychain=$keychain" >> "$GITHUB_OUTPUT"

      - name: Make the App Store package
        env:
          # Naming an identity is what turns signing on; the profile is mandatory with it.
          SAFELY_SIGN_IDENTITY: ${{ steps.identity.outputs.app }}
          # Relative to apps/desktop: forge resolves it from the package directory.
          SAFELY_SIGN_PROFILE: signing/ci.provisionprofile
          SAFELY_SIGN_KEYCHAIN: ${{ steps.identity.outputs.keychain }}
          SAFELY_INSTALLER_IDENTITY: ${{ steps.identity.outputs.installer }}
          # Becomes CFBundleVersion and the About panel's build number; a build without it says `local`.
          SAFELY_BUILD_NUMBER: ${{ needs.allocate-build-number.outputs.number }}
        run: pnpm --filter @safely/desktop run make:mas

      # The store's guarantees are properties of this signature, so a build that fails here must not
      # be uploaded. Whether securityd honours it is only visible when the app runs.
      - name: Verify signatures
        run: |
          set -euo pipefail

          apps/desktop/signing/verify-signature.sh apps/desktop/out/Safely-mas-arm64/Safely.app

          pkgs=(apps/desktop/out/make/*.pkg)
          if [ ${#pkgs[@]} != 1 ] || [ ! -f "${pkgs[0]}" ]; then
            echo "Expected exactly one .pkg in out/make, found: ${pkgs[*]}" >&2
            exit 1
          fi
          pkgutil --check-signature "${pkgs[0]}"
          cp "${pkgs[0]}" "$RUNNER_TEMP/Safely.pkg"

      # The handover to `upload`. Short-lived: the package is useful only until App Store Connect has it.
      - name: Store the package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ needs.allocate-build-number.outputs.artifact }}
          path: |
            ${{ runner.temp }}/Safely.pkg
            ${{ runner.temp }}/desktop-dependencies.txt
          if-no-files-found: error
          retention-days: 3

      - name: Remove signing identities
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
          rm -f apps/desktop/signing/ci.provisionprofile

  # A job of its own so the API key and the certificates never share a runner: the environment holds
  # both, but a job receives only the secrets it references, and this one references the key only.
  upload:
    needs: [allocate-build-number, build]
    runs-on: macos-15
    environment: desktop-release
    timeout-minutes: 30
    permissions: {}
    steps:
      - name: Fetch the package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.allocate-build-number.outputs.artifact }}
          path: ${{ runner.temp }}/package

      # altool looks the key up by id in a fixed set of directories; it takes no path to the file.
      - name: Install the API key
        env:
          API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
          API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
        run: |
          set -euo pipefail
          mkdir -p ~/.appstoreconnect/private_keys
          printf '%s' "$API_KEY_P8" > ~/.appstoreconnect/private_keys/AuthKey_"$API_KEY_ID".p8
          chmod 600 ~/.appstoreconnect/private_keys/AuthKey_"$API_KEY_ID".p8

      # Validation first: it reports what App Store Connect would refuse — a missing icon size, an
      # entitlement the profile does not grant, a reused build number — without consuming anything.
      - name: Validate
        env:
          API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
        run: |
          xcrun altool --validate-app -t macos -f "$RUNNER_TEMP/package/Safely.pkg" \
            --apiKey "$API_KEY_ID" --apiIssuer "$API_ISSUER_ID"

      - name: Upload to App Store Connect
        env:
          API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
        run: |
          xcrun altool --upload-app -t macos -f "$RUNNER_TEMP/package/Safely.pkg" \
            --apiKey "$API_KEY_ID" --apiIssuer "$API_ISSUER_ID"

      - name: Remove the API key
        if: always()
        run: rm -rf ~/.appstoreconnect

  # The release, what release-draft.yml and release-assets.yml are for mobile: on master, after a
  # successful upload, the GitHub prerelease `v<desktop version>-desktop` is published on this commit
  # with the signed .pkg and the dependency listing. Its own tag, so it never collides with the
  # mobile `v<version>` even when the numbers coincide — the platforms version independently. The
  # build is produced here, not on EAS, so the assets attach directly instead of through a polling
  # workflow. Publishing creates the tag; prerelease until the Mac App Store rollout, done by hand.
  release:
    needs: [prepare, allocate-build-number, build, upload]
    if: needs.prepare.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Fetch the build artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.allocate-build-number.outputs.artifact }}
          path: ${{ runner.temp }}/release

      - name: Publish the desktop release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
          TAG: ${{ needs.prepare.outputs.tag }}
          NUMBER: ${{ needs.allocate-build-number.outputs.number }}
        run: |
          set -euo pipefail

          stage="$RUNNER_TEMP/release"
          pkg="$stage/Safely-$VERSION-b$NUMBER.pkg"
          mv "$stage/Safely.pkg" "$pkg"

          # The commit, not `master`: a branch name would let the tag land wherever master points.
          gh release create "$TAG" "$pkg" "$stage/desktop-dependencies.txt" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --notes "Desktop $VERSION (build $NUMBER) — ${GITHUB_SHA:0:7}, uploaded to TestFlight. Prerelease until the Mac App Store rollout." \
            --prerelease

          echo "::notice::$TAG published with the package and the dependency listing"

  # A separate job because writing a repository variable needs a token, and a token that can write
  # to the repository must sit in neither of the jobs above. Depending on `upload` is what makes a
  # number belong to a build App Store Connect has.
  record-build-number:
    needs: [allocate-build-number, upload]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Record the build number
        env:
          GH_TOKEN: ${{ secrets.BUILD_NUMBER_TOKEN }}
          NUMBER: ${{ needs.allocate-build-number.outputs.number }}
        run: |
          set -euo pipefail

          if [ -z "${GH_TOKEN:-}" ]; then
            echo "BUILD_NUMBER_TOKEN is unset, so the next build would be numbered $NUMBER again" >&2
            exit 1
          fi

          gh variable set DESKTOP_BUILD_NUMBER_MACOS --repo "$GITHUB_REPOSITORY" --body "$NUMBER"
          echo "DESKTOP_BUILD_NUMBER_MACOS is now $NUMBER"

  # Runs whatever the other jobs did, so a crash is reported too — except when `prepare` found
  # nothing to build: a merge into master that leaves the desktop version alone is not an event.
  # Separate job on ubuntu: the webhook is a repository secret, and it has no business sitting next
  # to the certificates or the API key. It waits for the counter as well: a build that reached Apple
  # with the counter left behind makes the next run fail as a duplicate, and that has to be said now,
  # not discovered then.
  report:
    needs: [prepare, allocate-build-number, build, upload, release, record-build-number]
    # `!= 'false'`, not `== 'true'`: a failed `prepare` has no outputs and has to be reported too.
    if: always() && needs.prepare.outputs.build != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      # Shallow checkout still carries HEAD, which is where the version and the subject come from.
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # The Slack side is a Workflow Builder trigger, which consumes a flat JSON whose keys are the
      # variables that workflow declares: header, status_string, artifact_url.
      - name: Post the build status to Slack
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          PREPARE_RESULT: ${{ needs.prepare.result }}
          ALLOCATE_RESULT: ${{ needs.allocate-build-number.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          UPLOAD_RESULT: ${{ needs.upload.result }}
          RELEASE_RESULT: ${{ needs.release.result }}
          RECORD_RESULT: ${{ needs.record-build-number.result }}
          BUILD_NUMBER: ${{ needs.allocate-build-number.outputs.number }}
          TAG: ${{ needs.prepare.outputs.tag }}
          # Optional: the App Store Connect app id, which turns the link into its TestFlight page.
          ASC_APP_ID: ${{ vars.DESKTOP_ASC_APP_ID }}
        run: |
          set -euo pipefail

          # Guards against an unresolved `${{ secrets.* }}` literal, and against an unset secret.
          case "${SLACK_WEBHOOK_URL:-}" in
            https://*) ;;
            *)
              echo "::warning::SLACK_WEBHOOK_URL is unset or not a URL — skipping the Slack report"
              exit 0
              ;;
          esac

          version="$(jq -r .version apps/desktop/package.json)"
          subject="$(git log -1 --pretty=%s)"
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

          # App Store Connect refuses a build number it has seen, so every outcome where Apple may
          # hold this number but the counter does not says how to move the counter on.
          if [ "$PREPARE_RESULT" != "success" ]; then
            status="❌ Desktop release check failed — see the run"
            url="$run_url"
          elif [ "$UPLOAD_RESULT" = "success" ] && [ "$RECORD_RESULT" = "success" ] && [ "$RELEASE_RESULT" = "success" ]; then
            status="✅ Released $TAG (${BUILD_NUMBER:-?}) — uploaded to TestFlight, published on GitHub"
            url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$TAG"
          elif [ "$UPLOAD_RESULT" = "success" ] && [ "$RECORD_RESULT" = "success" ] && [ "$RELEASE_RESULT" = "skipped" ]; then
            status="✅ Uploaded to TestFlight $version (${BUILD_NUMBER:-?})"
            if [ -n "${ASC_APP_ID:-}" ]; then
              url="https://appstoreconnect.apple.com/apps/$ASC_APP_ID/testflight/macos"
            else
              url="$run_url"
            fi
          elif [ "$UPLOAD_RESULT" = "success" ] && [ "$RECORD_RESULT" = "success" ]; then
            status="⚠️ Uploaded $version (${BUILD_NUMBER:-?}) to TestFlight, but publishing $TAG failed — re-run the failed job only; the package is kept 3 days"
            url="$run_url"
          elif [ "$UPLOAD_RESULT" = "success" ]; then
            status="⚠️ Uploaded $version (${BUILD_NUMBER:-?}), but DESKTOP_BUILD_NUMBER_MACOS was not advanced — set it to ${BUILD_NUMBER:-?} before the next run"
            url="$run_url"
          elif [ "$BUILD_RESULT" = "success" ]; then
            status="❌ Desktop upload failed — if App Store Connect shows build ${BUILD_NUMBER:-?} anyway, set DESKTOP_BUILD_NUMBER_MACOS to it; retry with Re-run all jobs"
            url="$run_url"
          elif [ "$ALLOCATE_RESULT" != "success" ]; then
            status="❌ Desktop build number could not be read — check BUILD_NUMBER_TOKEN and DESKTOP_BUILD_NUMBER_MACOS"
            url="$run_url"
          else
            status="❌ Desktop build failed — retry with Re-run all jobs"
            url="$run_url"
          fi

          # jq builds the body so a commit subject carrying quotes or a backslash stays one string.
          payload="$(jq -n \
            --arg header "$GITHUB_REF_NAME <- $subject" \
            --arg status_string "$status" \
            --arg artifact_url "$url" \
            '{header: $header, status_string: $status_string, artifact_url: $artifact_url}')"

          echo "$payload"

          # A reporting hiccup must not turn an uploaded build red.
          code="$(printf '%s' "$payload" \
            | curl -sS -o /dev/stderr -w '%{http_code}' \
                -X POST -H 'Content-Type: application/json' --data @- \
                "$SLACK_WEBHOOK_URL" || echo 000)"

          if [ "$code" = "200" ]; then
            echo "Slack report posted."
          else
            echo "::warning::Slack rejected the report (HTTP $code)"
          fi
