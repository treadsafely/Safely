name: CI

on:
  pull_request:
    branches:
      - master
      - 'release/**'

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.10.0'

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Compile
        run: pnpm compile

      - name: Resolve base SHA
        id: base
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          # On pull_request the checkout is the PR *merge commit* (PR + current
          # base tip), and the pnpm "...[ref]" filter diffs the working tree
          # against BASE_SHA. So BASE_SHA must be the merge-base with HEAD, not
          # with the PR head SHA — otherwise commits landed on the base branch
          # after the fork point are picked up as "changed" packages.
          BASE_SHA=$(git merge-base "origin/$BASE_REF" HEAD)
          echo "sha=$BASE_SHA" >> "$GITHUB_OUTPUT"
          echo "Comparing against merge-base with $BASE_REF: $BASE_SHA"
          # Root-level changes (lockfile, eslint/tsconfig, patches, …) affect
          # every package, so lint/test must fall back to a full run.
          if git diff --name-only "$BASE_SHA" HEAD | grep -qvE '^(apps|packages)/'; then
            echo "root_changed=true" >> "$GITHUB_OUTPUT"
            echo "Root-level files changed — lint/test will run for all packages"
          else
            echo "root_changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Lint
        env:
          BASE_SHA: ${{ steps.base.outputs.sha }}
          ROOT_CHANGED: ${{ steps.base.outputs.root_changed }}
        # "!safely" excludes the root project: its lint is "pnpm -r run lint",
        # which would re-lint every package and defeat the changed-only filter.
        # scripts/ belongs to no package and "pnpm -r" skips the root project,
        # so it is linted by its own always-on call.
        run: |
          pnpm run lint:scripts
          if [ "$ROOT_CHANGED" = "true" ]; then
            pnpm -r run lint
          else
            pnpm --filter "...[$BASE_SHA]" --filter "!safely" run lint
          fi

      - name: Resolve dev-sync.safely.app
        env:
          DEV_SYNC_IP: ${{ secrets.DEV_SYNC_IP }}
        run: |
          if [ -n "$DEV_SYNC_IP" ]; then
            echo "$DEV_SYNC_IP dev-sync.safely.app" | sudo tee -a /etc/hosts > /dev/null
          else
            echo "DEV_SYNC_IP secret is not set — dev-sync.safely.app will not resolve"
          fi

      - name: Test
        env:
          BASE_SHA: ${{ steps.base.outputs.sha }}
          ROOT_CHANGED: ${{ steps.base.outputs.root_changed }}
        run: |
          if [ "$ROOT_CHANGED" = "true" ]; then
            pnpm -r run test
          else
            pnpm --filter "...[$BASE_SHA]" --filter "!safely" run test
          fi


  dependency-advisories:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24.10.0'

      - uses: pnpm/action-setup@v6
        with:
          run_install: false

      # `pnpm audit` resolves the graph from the lockfile, so no install is needed.
      - name: Check dependency advisories
        run: node scripts/audit-gate.mjs

  resolve-changes:
    runs-on: ubuntu-latest
    outputs:
      mobile: ${{ steps.filter.outputs.mobile }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Detect apps/mobile changes
        id: filter
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          BASE_SHA=$(git merge-base "origin/$BASE_REF" "$HEAD_SHA")
          if git diff --name-only "$BASE_SHA" "$HEAD_SHA" | grep -q '^apps/mobile/'; then
            echo "mobile=true" >> "$GITHUB_OUTPUT"
          else
            echo "mobile=false" >> "$GITHUB_OUTPUT"
          fi

  # Swift: pure Pbkdf2Core via the host-only SwiftPM package (CommonCrypto is
  # macOS-only). No Xcode project, CocoaPods, Expo or RN.
  swift-core-tests:
    needs: resolve-changes
    if: needs.resolve-changes.outputs.mobile == 'true'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - name: Run Swift core tests
        run: swift test
        working-directory: apps/mobile/modules/safely-crypto/ios
      - name: Run Swift mask engine tests
        run: swift test
        working-directory: apps/mobile/modules/safely-masked-input/ios
      - name: Run Swift push content tests
        run: swift test
        working-directory: apps/mobile/modules/safely-push-content/ios

  # Kotlin: pure *Core.kt on a plain JVM via the host-only Gradle harness. No
  # Android SDK, Expo, RN or node — just JDK + Gradle.
  kotlin-core-tests:
    needs: resolve-changes
    if: needs.resolve-changes.outputs.mobile == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
      - name: Run Kotlin core tests
        run: ./gradlew test
        working-directory: apps/mobile/modules/safely-crypto/android/host-test
      - name: Run Kotlin mask engine tests
        run: ./gradlew test
        working-directory: apps/mobile/modules/safely-masked-input/android/host-test
      - name: Run Kotlin push content tests
        run: ./gradlew test
        working-directory: apps/mobile/modules/safely-push-content/android/host-test
