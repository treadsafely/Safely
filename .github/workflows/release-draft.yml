name: Release draft

# A release is the merge of `release/<major>.<minor>.<patch>` into master.
on:
    pull_request:
        types: [closed]
        branches: [master]

permissions:
    contents: read

jobs:
    draft:
        name: Draft the release
        if: ${{ github.event.pull_request.merged && startsWith(github.head_ref, 'release/') }}
        runs-on: ubuntu-latest
        permissions:
            contents: write
        outputs:
            tag: ${{ steps.release.outputs.tag }}
        steps:
            - uses: actions/checkout@v7
              with:
                  ref: ${{ github.event.pull_request.merge_commit_sha }}

            - name: Resolve the version
              id: version
              env:
                  HEAD_REF: ${{ github.head_ref }}
              run: |
                  BRANCH="${HEAD_REF#release/}"
                  # A `release/*` branch naming no version is not a release.
                  if ! printf '%s' "$BRANCH" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
                      echo "::notice::$HEAD_REF does not name a version — no release"
                      echo "version=" >> "$GITHUB_OUTPUT"
                      exit 0
                  fi
                  # app.config.js takes the app version from here, so the tag must too.
                  APP_VERSION=$(node -p "require('./apps/mobile/package.json').version")
                  if [ "$APP_VERSION" != "$BRANCH" ]; then
                      echo "::error::$HEAD_REF says $BRANCH, apps/mobile/package.json says $APP_VERSION"
                      exit 1
                  fi
                  echo "version=$BRANCH" >> "$GITHUB_OUTPUT"

            - name: Create the draft release
              id: release
              if: ${{ steps.version.outputs.version != '' }}
              env:
                  GH_TOKEN: ${{ github.token }}
                  VERSION: ${{ steps.version.outputs.version }}
                  MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
              run: |
                  TAG="v$VERSION"
                  echo "tag=$TAG" >> "$GITHUB_OUTPUT"
                  if gh release view "$TAG" > /dev/null 2>&1; then
                      echo "::notice::$TAG already exists — leaving it alone"
                      exit 0
                  fi

                  # Generated notes need an earlier tag; the first release has none.
                  TAGS=$(gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/v" --jq 'length')
                  if [ "$TAGS" = "0" ]; then
                      NOTES=(--notes "First tracked release. Artifacts are attached by the release-assets workflow.")
                  else
                      NOTES=(--generate-notes)
                  fi

                  # The merge commit, not `master`: the tag is created on publish.
                  gh release create "$TAG" --draft --prerelease \
                      --target "$MERGE_SHA" --title "$TAG" "${NOTES[@]}"

    # Normally finds nothing yet; that workflow's schedule finishes the job.
    attach:
        name: Attach the artifacts
        needs: draft
        if: ${{ needs.draft.outputs.tag != '' }}
        permissions:
            contents: write
        uses: ./.github/workflows/release-assets.yml
        with:
            tag: ${{ needs.draft.outputs.tag }}
        secrets: inherit
