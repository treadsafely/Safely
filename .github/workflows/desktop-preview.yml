name: Desktop QA build

# A build QA can install with the real data protection keychain. It is signed with a **Mac
# Development** certificate issued for this pipeline alone, so the pipeline never holds the
# Developer ID key and revoking its certificate touches no local identity: a leaked development
# certificate is revoked in one click, cannot be notarised, and only grants the entitlement on the
# machines listed in the profile. Releases stay a local, notarised Developer ID build —
# `.claude/rules/desktop-signing.md`.

on:
  # A merge into a release branch is a push to it. The `qa-desktop` environment has to allow the ref
  # as a deployment branch, or the run starts and reaches no certificate.
  push:
    branches:
      - 'release/**'
  workflow_dispatch:

permissions:
  contents: read

# One counter for every run, so two of them must not read it before either has written it back.
# Queue rather than cancel: a signed build in progress is worth more than a short queue.
concurrency:
  group: desktop-qa-build
  cancel-in-progress: false

jobs:
  build:
    # macos-15 is arm64: the same architecture as the native addon and the QA machines.
    runs-on: macos-15
    # Holds the signing secrets. Restrict its branches and reviewers there, not here — a workflow
    # run on any other ref then cannot read the certificate.
    environment: qa-desktop
    timeout-minutes: 30
    outputs:
      number: ${{ steps.number.outputs.number }}
      artifact_url: ${{ steps.upload.outputs.artifact-url }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The counter is the repository variable `DESKTOP_BUILD_NUMBER_MACOS` — GitHub's own storage,
      # so no commit, tag or cache holds build state. Unset reads as an empty string, which starts
      # at 1. `record-build-number` writes it back, and only after the signature gate passed, so a
      # failed run leaves no gap and no artifact carries a number QA cannot install.
      - name: Allocate build number
        id: number
        env:
          CURRENT: ${{ vars.DESKTOP_BUILD_NUMBER_MACOS }}
        run: |
          set -euo pipefail

          current="${CURRENT:-0}"

          case "$current" in
            '' | *[!0-9]*)
              echo "DESKTOP_BUILD_NUMBER_MACOS is not a whole number: '$current'" >&2
              exit 1
              ;;
          esac

          number=$((current + 1))

          echo "Build $number of ${GITHUB_SHA:0:7}"
          echo "number=$number" >> "$GITHUB_OUTPUT"
          echo "artifact=safely-desktop-qa-b$number-${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          run_install: false

      # No dependency or Electron cache on purpose: a cache is writable from every branch, and this
      # job holds a signing certificate. Five minutes of download beats a poisonable build input.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # `make` in one app does not run web-ui's codegen, and the renderer imports styled-system.
      - name: Generate styled-system
        run: pnpm --filter @safely/web-ui run codegen

      # pnpm does not always run electron's postinstall, and forge cannot package without the binary.
      - name: Ensure the electron binary
        run: |
          set -euo pipefail
          dir="$(cd apps/desktop && node -p "require('path').dirname(require.resolve('electron/package.json'))")"
          if [ ! -d "$dir/dist" ]; then
            echo "electron/dist is missing — running its installer"
            (cd "$dir" && node install.js)
          fi

      - name: Import signing identity
        id: identity
        env:
          CERT_P12: ${{ secrets.APPLE_DEV_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.APPLE_DEV_CERT_PASSWORD }}
          PROVISIONING_PROFILE: ${{ secrets.APPLE_DEV_PROVISIONING_PROFILE }}
        run: |
          set -euo pipefail

          keychain="$RUNNER_TEMP/signing.keychain-db"
          password="$(openssl rand -base64 24)"

          printf '%s' "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          printf '%s' "$PROVISIONING_PROFILE" | base64 --decode > apps/desktop/signing/ci.provisionprofile

          security create-keychain -p "$password" "$keychain"
          # codesign resolves an identity through the search list; --keychain alone is not enough.
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          # No flags on purpose: the keychain must not relock while packaging is still signing.
          security set-keychain-settings "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          # -x: the private key cannot be exported again, only used — and only by codesign.
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$CERT_PASSWORD" -T /usr/bin/codesign -x
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain" > /dev/null
          rm -f "$RUNNER_TEMP/cert.p12"

          # A truncated secret decodes to a file that only fails deep inside packaging.
          security cms -D -i apps/desktop/signing/ci.provisionprofile > /dev/null

          # The keychain is fresh, so one identity is the only correct answer; two would make the
          # signature depend on ordering, none means the .p12 carried no usable key.
          identity="$(security find-identity -v -p codesigning "$keychain" | sed -n 's/.*"\(.*\)"/\1/p')"
          count="$(printf '%s' "$identity" | grep -c . || true)"

          if [ "$count" != "1" ]; then
            echo "Expected exactly one codesigning identity in the imported keychain, found $count" >&2
            exit 1
          fi

          echo "Signing as: $identity"
          echo "identity=$identity" >> "$GITHUB_OUTPUT"
          echo "keychain=$keychain" >> "$GITHUB_OUTPUT"

      - name: Package signed app
        env:
          # Naming an identity is what turns signing on; the profile is mandatory with it.
          SAFELY_SIGN_IDENTITY: ${{ steps.identity.outputs.identity }}
          # Relative to apps/desktop: forge resolves it from the package directory.
          SAFELY_SIGN_PROFILE: signing/ci.provisionprofile
          SAFELY_SIGN_KEYCHAIN: ${{ steps.identity.outputs.keychain }}
          # Becomes CFBundleVersion and the About panel's build number; a build without it says `local`.
          SAFELY_BUILD_NUMBER: ${{ steps.number.outputs.number }}
        run: pnpm --filter @safely/desktop run make

      # The store's guarantees are properties of this signature, so a build that fails here must not
      # reach QA. Whether securityd honours it is only visible when the app runs.
      - name: Verify signature
        run: apps/desktop/signing/verify-signature.sh apps/desktop/out/Safely-darwin-arm64/Safely.app

      - name: Upload build
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.number.outputs.artifact }}
          path: apps/desktop/out/make/zip/darwin/arm64/*.zip
          if-no-files-found: error
          retention-days: 14

      - name: Installation notes
        env:
          BUILD_NUMBER: ${{ steps.number.outputs.number }}
        run: |
          {
            echo "### Safely desktop — DEV build $BUILD_NUMBER"
            echo
            echo "Commit \`${GITHUB_SHA:0:7}\` on \`$GITHUB_REF_NAME\`, signed with the Mac"
            echo "Development identity."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove signing identity
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
          rm -f apps/desktop/signing/ci.provisionprofile

  # A separate job because writing a repository variable needs a token, and a token that can write
  # to the repository must not sit in the job that holds the signing certificate. Depending on
  # `build` is also what makes a number belong to an installable artifact.
  record-build-number:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Record the build number
        env:
          GH_TOKEN: ${{ secrets.BUILD_NUMBER_TOKEN }}
          NUMBER: ${{ needs.build.outputs.number }}
        run: |
          set -euo pipefail

          if [ -z "${GH_TOKEN:-}" ]; then
            echo "BUILD_NUMBER_TOKEN is unset, so the next build would be numbered $NUMBER again" >&2
            exit 1
          fi

          gh variable set DESKTOP_BUILD_NUMBER_MACOS --repo "$GITHUB_REPOSITORY" --body "$NUMBER"
          echo "DESKTOP_BUILD_NUMBER_MACOS is now $NUMBER"

  # Runs whatever `build` did, so a crash is reported too. Separate job on ubuntu: the webhook is a
  # repository secret, and it has no business sitting in the job that holds the signing certificate.
  report:
    needs: build
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      # Shallow checkout still carries HEAD, which is where the version and the subject come from.
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # The Slack side is a Workflow Builder trigger, which consumes a flat JSON whose keys are the
      # variables that workflow declares: header, status_string, artifact_url.
      - name: Post the build status to Slack
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          BUILD_RESULT: ${{ needs.build.result }}
          BUILD_NUMBER: ${{ needs.build.outputs.number }}
          # Empty unless the upload step ran: the artifact link only exists once there is an artifact.
          ARTIFACT_URL: ${{ needs.build.outputs.artifact_url }}
        run: |
          set -euo pipefail

          # Guards against an unresolved `${{ secrets.* }}` literal, and against an unset secret.
          case "${SLACK_WEBHOOK_URL:-}" in
            https://*) ;;
            *)
              echo "::warning::SLACK_WEBHOOK_URL is unset or not a URL — skipping the Slack report"
              exit 0
              ;;
          esac

          version="$(jq -r .version apps/desktop/package.json)"
          subject="$(git log -1 --pretty=%s)"
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

          if [ "$BUILD_RESULT" = "success" ]; then
            status="✅ Successful build $version (${BUILD_NUMBER:-?})"
            url="${ARTIFACT_URL:-$run_url}"
          else
            status="❌ Desktop build failed"
            url="$run_url"
          fi

          # jq builds the body so a commit subject carrying quotes or a backslash stays one string.
          payload="$(jq -n \
            --arg header "$GITHUB_REF_NAME <- $subject" \
            --arg status_string "$status" \
            --arg artifact_url "$url" \
            '{header: $header, status_string: $status_string, artifact_url: $artifact_url}')"

          echo "$payload"

          # A reporting hiccup must not turn a signed, uploaded build red.
          code="$(printf '%s' "$payload" \
            | curl -sS -o /dev/stderr -w '%{http_code}' \
                -X POST -H 'Content-Type: application/json' --data @- \
                "$SLACK_WEBHOOK_URL" || echo 000)"

          if [ "$code" = "200" ]; then
            echo "Slack report posted."
          else
            echo "::warning::Slack rejected the report (HTTP $code)"
          fi
