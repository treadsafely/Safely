name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **Security issue?** Do not file it here — see [SECURITY.md](https://github.com/andreevco/safely/blob/master/SECURITY.md).
        **Never paste a mnemonic, private key, xprv/xpub or real addresses** into an issue.
  - type: textarea
    id: description
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. …
        2. …
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version
      placeholder: e.g. 1.2.4
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - iOS
        - Android
        - Other
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and OS version
      placeholder: e.g. iPhone 15, iOS 18.5
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Check that nothing sensitive is visible before attaching.
